<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description are overridden at startup by main.tsx using BRAND config;
         the values below are just loading-time placeholders. -->
    <title>ArcReel · Agent 驱动的 AI 视频创作工作台</title>
    <meta name="description" content="AI 视频创作工作台，统一管理项目、脚本、分镜、视频生成与 Agent 对话。" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // 首屏渲染前按主题偏好加上 .dark，避免先闪一下错误的主题；规则与 src/theme.ts 一致，改时一起改
      var theme = localStorage.getItem("arcreel_theme");
      if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      /* 首屏占位：JS 与 i18n 加载完成前 #app-root 是空的，移动网络下这段时间会是一整屏纯白。
         这里用内联样式先铺主题底色 + 一个静态转圈，不依赖任何外部资源；React 挂载时整体替换。 */
      html {
        background: oklch(0.985 0.003 265);
      }
      html.dark {
        background: oklch(0.19 0.012 265);
      }
      .boot-splash {
        display: flex;
        height: 100dvh;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: oklch(0.52 0.012 265);
        font-family: system-ui, sans-serif;
        font-size: 0.875rem;
      }
      .boot-splash__ring {
        width: 1rem;
        height: 1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 9999px;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__ring {
          animation: none;
        }
      }
    </style>

</head>
<body>
    <div id="app-root">
      <div class="boot-splash">
        <span class="boot-splash__ring" aria-hidden="true"></span>
        <span>加载中</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
