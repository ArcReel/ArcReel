[route_neutrality]
# 路线中立约束：这些包 / 模块（含传递依赖）不得触达参考生视频子包
sources = [
    "lib.references",
    "lib.script.draft_violation",
    "lib.script.draft_quarantine",
    "lib.episode.episode_paths",
]
forbidden = "lib.script.reference_video"

[rulings]
# ---- 争议归属裁定
"lib.script_review" = "归 script。它实现「脚本与分镜」的内容确认（review gate）：确认指纹、pending/confirmed 派生、script_plan 路径与唯一写盘出口；登记产物清单只是写盘后的一次延迟回调。放 artifacts 会让产物包承载脚本规划的全部规则。"
"lib.cost_calculator" = "归 billing。它按价格表与 pricing kind 算费用，是「计费」一节的费用计算；供应商口径只剩 gemini 默认模型常量与方舟 token 估算常量两处寄居，按「术语在哪一节」不改变归属（backends → billing 的反向依赖见 accepted_edges）。"
"lib.media_generator" = "归 generation。它把调用通道、版本提交（产物）、记账（计费）与任务暂存路径编排在一起，自称中间层，调用方是生成 Worker 与生成上下文；放 backends 会让调用通道层依赖产物与计费，而任务暂存路径本身是任务概念。"
"lib.grid_manager" = "归 script.grid。「多宫格分镜」在脚本与分镜一节，lib.grid 整体作为 script 的子包；宫格记录的读写与宫格模型分居两处正是 Spec 要消除的散落。只在既有子包里新增文件，不改其内部结构。"
"lib.thumbnail" = "归 infra。纯 ffmpeg 子进程封装，不 import 任何 lib 模块、没有领域状态；video_thumbnail 字段由服务端写入，本模块并不知道它。"
"lib.image_utils" = "归 infra。纯 PIL 的 bytes → bytes 处理，没有 lib 依赖；术语表明确要求「上传保存时压缩」不与参考图压缩混称，所以不进 references；领域知识只停留在默认参数上。"
"lib.source_revision" = "归 project。它为资产分析计算源文件集合的修订摘要：术语表「项目拥有自己的源文件」，主要消费者是资产盘点与资产分析步骤；对 episode_ledger 的依赖只是识别派生集文件，方向 project → episode 可以接受。"
"lib.profile_manifest" = "归 agent。它把 Agent 运行 profile 物化进项目（manifest + sha256 三态决策），「profile 物化」在 Agent 运行时一节；构建期 lint 脚本只是复用它的解析。ContentMode 常量寄居于此导致 project → agent 的依赖，拆出常量属行为重构，不在本次范围。"
"lib.profile_frontmatter" = "归 agent。运行时列出 skills 时解析 SKILL frontmatter（server/agent_runtime），lint 脚本复用同一校验；与 profile_manifest 同属 Agent 运行 profile。"
"lib.formal_write" = "归 artifacts。它是「正式产物」的多文件写入快照与回滚事务（docstring 即 formal artifact commits），调用方横跨脚本、剧集、项目、宫格与产物；放 script 会让 artifacts / project / episode 都反向依赖 script。它零领域依赖，但承载「正式写」这一产物语义，不进 infra。"

# ---- 读过内容再定的两个模块
"lib.data_validator" = "归 project。1661 行校验三类对象：project.json 负载、剧集脚本 JSON、归档导入的项目目录树；主入口与主要调用方（项目管理、资产盘点、项目归档）都在项目侧，剧集脚本部分是项目完整性校验的一环。名字像工具，内容是项目与资产的领域校验，不进 infra；拆出剧集半边属于拆文件，不在本次范围。"
"lib.system_config" = "归 config。内容是已废弃的旧 JSON 系统配置管理器（被 lib.config 的 ConfigService + DB 取代）与仍在用的 Vertex 凭证路径解析，核心库内的生产调用方是 lib.config.migration（JSON → DB 迁移）与两个 gemini 调用通道；它是「解析」一节配置来源的旧实现。只在 config 里新增文件：改写后的分层契约判定不变（见报告）。删除废弃部分属行为变更，不在本次范围。"

# ---- 应用服务层 8 个不依赖服务端的模块
"server.services.grid_access" = "移入 lib.script.grid。26 行、无状态无 IO，只抛核心库的 BadRequestError；是宫格写操作的项目级准入判定，没有隐式耦合。"
"server.services.grid_resolution" = "移入 lib.script.grid。无模块级状态；函数体内自开 DB session 读配置，与 lib.config 既有做法相同，不依赖服务端的会话生命周期。"
"server.services.image_artifact_currency" = "移入 lib.artifacts。纯 dataclass 与 Receipt 补偿逻辑，VersionManager 与回调都经参数注入，没有全局状态。"
"server.services.project_archive" = "留在 server.services.project。它虽不 import server 模块，但导入事务横跨产物激活、配置、分集、项目迁移、参考生视频与源文件载入，并负责覆盖安装失败后的回滚，符合应用服务「跨多个领域包协调事务或补偿」的保留判据；固定 source=\"webui\" 还表明当前出口带交付层语义。"
"server.services.generation_context" = "留在 server.services.tasks。未通过隐式耦合检查：模块级 rate_limiter 单例与绑定事件循环的 backend 缓存，失效由四个配置路由驱动，并依赖 get_project_manager() 单例；ADR 0039 规定缓存留在调用方。"
"server.services.project_cover" = "留在 server.services.project。未通过：返回值写死 /api/v1/files/ 路由前缀，是交付层契约；移入核心库等于把 HTTP 路径知识带进去（version_manager 的同类写法是既有漂移，不作先例）。改为返回相对路径属行为变更。"
"server.services.reference_admission" = "留在 server.services.admission。未通过：它把核心库的引用准入结论翻译成路由异常与批量问题两种回执，自称服务端契约，供路由与 Agent 媒体工具两个入口共用——正是「同一用例被多个入口共用」的应用服务。"
"server.services.video_caps" = "留在应用服务层，归 server.services.tasks。未通过：模块级绑定 async_session_factory（导入期固化全局会话工厂），集成测试全局 fixture 按模块路径替换它，报错文案面向 Agent。放 tasks 而不是 admission：能力解析同时被执行器（reference_video_tasks）与批量准入消费，放在较低的 tasks 族消除了 tasks ↔ admission 的包间环。"

# ---- 应用服务层其余模块的族归属中有取舍的
"server.services.narration_delivery_tasks" = "归 tasks。它执行解说交付的物化；呈现、时效与准入对它「付费产出有效性」判定的依赖是跨族消费，不改变它是执行器。"
"server.services.upload_finalize" = "归 currency。用户上传分镜图 / 视频后的版本与激活收尾，属产物时效族；它借用 generation_tasks 发成功事件是跨族调用。"
"server.services.end_frame" = "归 project。设置或清除分镜尾帧快照是项目内容编辑，依赖 upload_finalize 是跨族调用。"
"server.services.prompt_preview" = "归 admission。预览入队前的最终提示词，复用批量准入的判定；与 workflow_planner 同为入队前的只读推演。"
"server.services.workflow_planner" = "归 project。它是项目制作计划的异步适配，服务项目视图与 Agent；依赖批量准入是跨族调用。"
"server.services.cost_estimation" = "归 admission。「准入与预估族」的预估；实际费用汇总部分读 billing 包，不改变其用例归属。"
"server.services.diagnostics" = "归 server.services.system，六族之外的唯一例外。它收集脱敏的系统诊断（版本、数据目录、数据库 URL、沙箱状态），延迟 import server.app，不能移入核心库；presentation 族的既有模块都实现成片、字幕与剪映导出等媒体呈现，把运维诊断塞进去只因二者都是输出，会违背「模块是什么」的归属判据。"

# ---- 其他需要说明的归属
"lib.generation_type_buckets" = "归 backends 而不是 config。术语「任务类型桶」在解析一节，但它的依赖全在供应商能力一侧（装配规格、调用通道基类、自定义供应商能力）；放进 config 会让分层契约的最底层 config 直接依赖 backends 与 custom_provider，改写后的契约将新增违规（预演已验证），违反「存量豁免不增加」。"
"lib.image_reference_snapshot" = "归 artifacts 而不是 references。Spec 把「快照」列在 references 下，但它的不变式是「正式视觉依据与供应商消费同一份不可变字节」，唯一的 lib 依赖是 visual_artifact_provenance；放 references 会让参考图包经依据构建传递依赖参考生视频子包，破坏路线中立约束（预演已验证）。"
"lib.reference_image_numbering" = "归 prompts 而不是 references。它为提示词生成「图N」编号、声明行与 @[名] 替换，调用方是提示词构造器、宫格提示词与图像通道基类；它直接依赖参考生视频子包的 @[名] 解析器，放 references 会破坏路线中立约束。「参考图裁剪」术语仍属参考图一节，由本模块在提示词侧落地。"
"lib.aspect_size" = "归 backends。「尺寸与比例」一节没有对应的包；它的调用方全部是调用通道与自定义供应商，作为供应商共用底座不引入新的依赖方向。"
"lib.agent_provider_catalog" = "归 agent。「Agent 凭证」一词写在供应商与模型一节，但这份预设目录只服务 Claude Agent SDK 的网关凭证，与图像 / 视频供应商互不相通。"
"lib.api_errors" = "归 infra。带状态码与 i18n key 的领域异常基类，不依赖 HTTP 框架，由服务端统一翻译；它横跨全部领域，不属于任何一节术语。"
"lib.audio_utils" = "归 speech。除 ffprobe 时长探测外，还承载角色参考音频路径解析与旧参考音频清理（「角色声音绑定方式」的 reference_audio），带领域知识，不进 infra。"
"lib.call_failure" = "归 billing。它是供应商调用失败落 api_calls 的机器码，自称记账层，与任务失败码不共用枚举；随 Ledger 与使用记录。"
"lib.ledger" = "归 billing，保留原文件名。术语表「使用记录」的 _Avoid_ 列有「账本」，但类名 Ledger 与全部调用点一并改名属于代码重命名，超出「只换目录」；改名留给后续。"
"lib.providers" = "归 backends。以供应商名称常量为主体，无依赖叶子；其中的调用词汇（CallType / CallStatus / CallPurpose）属计费与任务，拆分属改代码，不在本次范围。"
"lib.text_generator" = "归 backends。它是文本通道 + 记账的装配包装，不进入队列、没有任务语义；与 MediaGenerator 不对称是合理的——后者提交版本与产物。"
"lib.video_frame_slots" = "归 backends。主体是按模型能力做视频请求期校验与首尾帧槽位规划，运行期只依赖 video_backends.base，自定义供应商的试跑与预览也调用它。"
"lib.kling_backend_base" = "归 backends 顶层。可灵图像 / 视频两个通道共用的脚手架基类，建在 video_backends.base 之上，不属于共用底座那一层；放进任一调用通道子包都要改动既有子包内部。"
"lib.speech_artifact_provenance" = "归 speech。它产出 ArtifactBasis，但依据内容全是声音事实并依赖 speech_composition；产物包以依赖方身份消费它。"
"lib.speech_rate" = "归 speech。语速是配音概念，成片呈现的字幕定时也用它；脚本与提示词用它做时长上界校验属消费方。"
"lib.legacy_media_provenance" = "归 project。它只为 v12 → v13 一步项目迁移补录旧版本的生成依据，唯一调用方是该迁移步；与项目迁移机制放在一起，不进迁移子包内部。"
"lib.project_migration_failure" = "归 project。「迁移失败判定」写在产物与制作状态一节，但 Spec 把项目迁移机制（project_migrations 子包）整体放在 project，失败判定、迁移报告、迁移守卫与它同属一套机制，随之归 project。"
"lib.resource_paths" = "归 project。它回答「项目里某种资源放哪」（目录布局纯函数），没有产物时效语义；产物包依赖项目布局是自然方向。"
"lib.validation_messages" = "归 infra。locale-neutral 的校验消息载体，被脚本、项目、自定义供应商与市场共用；放进任一领域包都会让位置不动的 custom_provider / market 依赖领域包。"
"lib.episode_paths" = "归 episode。script_plan 与草稿文件名、集源文与剧本路径的单一真相源，以「集」为单位组织；路线中立约束随之改写路径。"
"lib.style_templates" = "归 prompts。「风格模版」词条在项目与资产一节，但实现完全是内置提示词模版目录的 style 视图，唯一依赖是 prompt_templates。"
"lib.text_metrics" = "归 infra。按语言计「阅读单位」的纯函数，零依赖，术语表没有对应词条。"
"lib.reference_video" = "整体归 script 子包，位置变、内部不动。其中 text_parser（@[名] 解析器）被 prompts / speech / artifacts 共用、execution_checkpoint 更像任务概念，但拆出子包模块属于改动既有子包内部，不在本次范围。"

[accepted_edges]
# 键是包对「下层 -> 上层」：该父包内这两个子项之间的全部模块级 import 记为存量豁免（明细见报告）。
# 断环顺序由 preview.py 按「逆向 import 总数最小」求得；以下每条说明为什么不能靠调整归属消除。

# ---- lib 顶层（14 个包的强连通分量）
# 共同成因：当前代码里已有一个 77 个模块的模块级环（project_manager、artifact_*、config、custom_provider、
# 部分 backends 与 db 仓储互相可达），它横跨至少十个领域，任何按术语节的归属都拆不开；此外 project 包同时
# 持有被各领域引用的底层词汇（asset_types、resource_paths、project_schema）与引用各领域的顶层编排者
# project_manager，包级方向无法同时满足。局部搜索（逐个模块换包）里能显著减少逆向 import 的改动只有
# 「把 asset_types 移出 project」「把 artifact_planner / media_artifact_currency 移进 project」，都违背术语判据。
"lib.artifacts -> lib.episode" = "产物规划与脚本类产物依据读剧集路径、分集账本与单集目标时长；剧集重置又要注销清单条目。两端模块都实现各自一节的术语，挪任一端都违背归属判据。"
"lib.artifacts -> lib.project" = "产物清单与依据以资产类型、资源路径、项目 schema 版本为词汇，而 project_manager 编排产物激活与版本管理（6 条 import 在既有模块环上）。消除它需要把项目词汇移出 project，违背术语判据；拆分 project_manager 属行为重构。"
"lib.artifacts -> lib.script" = "产物规划与时效投影分镜顺序、宫格布局、脚本编辑与参考生视频时长；脚本写回反向登记清单（3 条在既有模块环上）。产物目标态的投影本身就是产物术语，移到 script 违背判据。"
"lib.backends -> lib.billing" = "gemini 共用底座与视频通道读 cost_calculator 上的默认模型常量、text_generator 组合 Ledger（2 条在既有模块环上）。把常量挪出计费属于改代码，不在纯搬迁范围。"
"lib.backends -> lib.custom_provider" = "装配层按声明式内置端点与自定义供应商装配 backend，分层契约已为 assembler / specs 这组边登记存量豁免；generation_type_buckets 的两条随其归属（放 config 会让分层契约新增违规）。"
"lib.backends -> lib.generation" = "video_backends.base 引用 generation_queue，是既有模块环上的一条；两端都在既有子包 / 领域内。"
"lib.billing -> lib.custom_provider" = "cost_calculator 判定自定义供应商计价，分层契约已登记同一条存量豁免；custom_provider 位置不动。"
"lib.config -> lib.backends" = "config.registry 读各供应商共用底座的常量、config.resolver 读装配规格与文本通道基类；分层契约已登记同一组存量豁免，归组只是以包粒度重现。"
"lib.config -> lib.billing" = "config.registry 引用 pricing.types，pricing.lookup 反读 config.registry——原 lib.config 与 lib.pricing 之间的既有互引，归组只是把 pricing 放进 billing。"
"lib.config -> lib.custom_provider" = "两包位置都不动；config.resolver 向上引用自定义供应商是分层契约里已登记的存量豁免。"
"lib.config -> lib.episode" = "config.resolver 读单集目标时长字段；config 位置不动，单集目标时长是「集」的设置，归 episode。"
"lib.config -> lib.project" = "config.resolver 延迟引用 project_manager，在既有模块环上。"
"lib.custom_provider -> lib.generation" = "端点试跑复用任务失败编码；custom_provider 位置不动，task_failure 实现「任务与取消」的失败编码。"
"lib.db -> lib.backends" = "任务与用量仓储引用 providers 的调用词汇；db 位置不动，拆分 providers 属改代码。"
"lib.db -> lib.billing" = "用量仓储结算时用调用失败码、费用计算、价格策略与用量汇总；db 位置不动，这些模块都是计费术语。"
"lib.db -> lib.config" = "两包位置都不动，是既有互引。"
"lib.db -> lib.custom_provider" = "两包位置都不动，是既有互引（分层契约已登记其中三条）。"
"lib.db -> lib.generation" = "任务仓储用任务失败编码与终态事件；db 位置不动，这两个模块实现「任务与取消」的术语。"
"lib.episode -> lib.project" = "分集规划与重置经 project_manager 读写项目，project_manager 又委托剧集台账与路径；同 artifacts -> project 的顶层编排者成因。"
"lib.episode -> lib.script" = "分集规划用内容确认；script 反向依赖剧集路径与台账。两包同属「脚本与分镜」一节，按 Spec 的前缀聚类拆包判据拆开，互引属同一节内部。"
"lib.prompts -> lib.project" = "提示词构造以资产类型为词汇；同 artifacts -> project 的底层词汇成因。"
"lib.prompts -> lib.script" = "提示词工具读脚本模型，图N 编号用 @[名] 解析器；同一节拆包后的内部互引。"
"lib.references -> lib.project" = "引用目录与引用准入以资产类型为词汇；同 artifacts -> project 的底层词汇成因。"
"lib.script -> lib.project" = "脚本写回、批量编辑与宫格准入经 project_manager；参考生视频与分镜提及以资产类型为词汇（1 条在既有模块环上）。"
"lib.speech -> lib.artifacts" = "旁白交付、声音依据与成片呈现产出 ArtifactBasis（产物清单的类型），产物包又消费声音依据；ArtifactBasis 是产物术语，不能移进 speech。"
"lib.speech -> lib.project" = "旁白交付与声音依据以资源路径、资产类型为词汇；同 artifacts -> project 的底层词汇成因。"
"lib.speech -> lib.script" = "旁白交付用参考生视频时长槽，speech_composition 用 @[名] 解析器；两者都在参考生视频子包内部，拆出属改动既有子包。"

# ---- lib.backends 内部
"lib.backends.backend_assembly -> lib.backends.text_backends" = "装配规格读 text_backends.registry，text_backends.factory 反向用装配层：两个既有子包之间的既有互引，子包内部不动。"
"lib.backends.kling_backend_base -> lib.backends.video_backends" = "可灵共用基类建在 video_backends.base 之上又被 video_backends.kling 继承，在既有模块环上；放进任一通道子包都要改动既有子包内部。"
"lib.backends.video_backends -> lib.backends.image_backends" = "video_backends.ark 复用 image_backends.base，既有子包之间的既有互引（分层契约里两者同层、非独立）。"

# ---- lib.generation / lib.project 内部（包内模块之间）
"lib.generation.generation_batch -> lib.generation.generation_result" = "队列、队列客户端、批次与结果契约之间的既有模块环；它们同属任务与取消，归属已一致，只能拆文件消除。"
"lib.project.data_validator -> lib.project.project_manager" = "既有模块环：project_manager 延迟 import data_validator，data_validator 读 project_manager 的常量。"
"lib.project.project_manager -> lib.project.project_migrations" = "既有模块环：迁移步经 project_manager 读写项目，project_manager 启动迁移。"

# ---- server.services
"server.services.currency -> server.services.tasks" = "时效族在任务执行族之下（执行器提交视频时效），但上传收尾借用 generation_tasks 发成功事件、版本还原借用参考生视频执行器、视频时效回用解说交付的有效性判定。把这三个被借用的能力从执行器模块里拆出属行为重构，对应 Spec Out of Scope 的「正式图像提交」议题；把借用方移进 tasks 族则违背它们「产物时效」的归属。"
"server.services.grid -> server.services.tasks" = "grid_split 与 generation_tasks 在既有模块环上（一边模块级、一边延迟导入），宫格切分借用执行入口的正式图像提交；同属 Out of Scope 的「正式图像提交」议题。"
"server.services.tasks.derivative_sheet_tasks -> server.services.tasks.generation_tasks" = "既有模块环（生成任务入口与各执行器互引，靠函数体内延迟导入绕环）；由 Out of Scope 的「正式图像提交」议题消除。"
"server.services.tasks.generation_tasks -> server.services.tasks.image_edit_tasks" = "同上，既有模块环。"
"server.services.tasks.generation_tasks -> server.services.tasks.reference_video_tasks" = "同上，既有模块环。"
