# 目录归组映射表：旧模块路径 → 新模块路径。
#
# 本文件是这次归组的设计产物与唯一真相源：搬迁脚本照它执行，预演脚本（preview.py）用它和现有导入图
# 计算新包边界下的包间环。评审批准本文件即批准每个模块的新归属。
#
# - [moves] 的键是旧模块路径（模块或整个子包），值是新模块路径；子包连同其全部子模块一起移动，
#   子模块路径按最长前缀改写（lib.pricing.lookup → lib.billing.pricing.lookup）。
# - 文件名默认不变、只换目录；改名的条目必须在 [rulings] 写明理由（preview.py 校验）。本表没有改名。
# - 镜像测试不在本表登记：tests/{unit,integration}/<源码目录>/ 的去向由 preview.py 从本表推导。
# - [rulings] 记录争议归属与应用服务层去留的裁定理由，键为旧模块路径。

