name: Sync public skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "agent_runtime_profile/.claude/skills/adapt-custom-endpoint/**"

permissions:
  contents: read

concurrency:
  group: sync-public-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ArcReel
          repositories: skills
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArcReel/skills
          path: distribution
          token: ${{ steps.app-token.outputs.token }}
          # 凭据不写进 distribution/.git/config；推送在下方单条命令里自带远程 URL
          persist-credentials: false

      - name: Mirror skills
        run: |
          rsync -a --delete --exclude /LICENSE --exclude /README.md source/skills/ distribution/skills/
          rsync -a --delete source/agent_runtime_profile/.claude/skills/adapt-custom-endpoint/ distribution/skills/adapt-custom-endpoint/
          cp source/skills/LICENSE distribution/LICENSE

      - name: Push changes
        working-directory: distribution
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add -A LICENSE skills
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync skills from ArcReel/ArcReel"
            # 分支名取自 checkout 落地的本地分支（ArcReel/skills 的默认分支）
            branch=$(git rev-parse --abbrev-ref HEAD)
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/ArcReel/skills.git" "HEAD:refs/heads/${branch}"
          fi
