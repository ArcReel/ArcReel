name: Sync public skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ArcReel
          repositories: skills
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArcReel/skills
          path: distribution
          token: ${{ steps.app-token.outputs.token }}

      - name: Mirror skills
        run: |
          rsync -a --delete --exclude LICENSE --exclude README.md source/skills/ distribution/skills/
          cp source/skills/LICENSE distribution/LICENSE

      - name: Push changes
        working-directory: distribution
        run: |
          git add -A LICENSE skills
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync skills from ArcReel/ArcReel"
            git push
          fi
