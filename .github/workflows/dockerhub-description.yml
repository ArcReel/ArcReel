name: Docker Hub Description

# Sync docs/dockerhub-README.md to the Docker Hub repository description. Descriptions rarely change;
# keep this separate from releases, which would otherwise make a pointless API write on every release
# and add another potential release failure.
#
# This action uses the Docker Hub repository metadata API, requiring a PAT with read/write/delete
# scopes. Give DOCKERHUB_TOKEN those scopes here; the release workflow shares the same token.

on:
  push:
    branches: [main]
    paths:
      - "docs/dockerhub-README.md"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same coordinates as docker-release.yml: Docker Hub namespace matches the GitHub organization.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Sync repository description to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME_LC }}
          readme-filepath: ./docs/dockerhub-README.md
          short-description: "Open-source, self-hosted AI video production workspace — novels and scripts to editable videos"
