name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "22 9 * * 3"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/domain-filter
        id: domains
        with:
          # schedule 事件无变更比对基准，直接全量扫描；发布 PR 与 test.yml 同口径全量
          full: ${{ github.event_name == 'schedule' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}
      - id: languages
        # 按域裁剪分析语言：纯前端变更不跑 python 分析，反之亦然
        env:
          BACKEND: ${{ steps.domains.outputs.backend }}
          FRONTEND: ${{ steps.domains.outputs.frontend }}
        run: |
          langs=()
          [[ "$BACKEND" == "true" ]] && langs+=('"python"')
          [[ "$FRONTEND" == "true" ]] && langs+=('"javascript-typescript"')
          joined=$(IFS=,; echo "${langs[*]}")
          echo "languages=[$joined]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"

  codeql-required:
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CodeQL jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CodeQL job failed"
            exit 1
          fi
          echo "CodeQL passed or skipped (affected domains only)"
