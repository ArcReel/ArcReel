# Market source index publication (reusable workflow).
#
# Callers: ArcReel/arcreel-market and forks, triggered after pushes to the default branch:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     publish-index:
#       uses: ArcReel/ArcReel/.github/workflows/market-publish-index.yml@main
#       permissions:
#         contents: write
#       secrets: # Optional: required only when both App secrets below are configured.
#         MARKET_APP_CLIENT_ID: ${{ secrets.MARKET_APP_CLIENT_ID }}
#         MARKET_APP_PRIVATE_KEY: ${{ secrets.MARKET_APP_PRIVATE_KEY }}
#
# Parameters: none. Permissions: caller must grant contents: write to commit and push the regenerated index.
#
# Optional secrets (when branch protection prevents GITHUB_TOKEN from pushing directly; configure both together):
#   MARKET_APP_CLIENT_ID    Client ID of the GitHub App listed as a ruleset bypass actor.
#   MARKET_APP_PRIVATE_KEY  That App’s private key.
# Prefer same-named secrets in the caller repository and explicitly map both names under `uses:`; same-organization repositories may use `secrets: inherit`.
# With both present, actions/create-github-app-token obtains an installation token limited to contents: write on the caller repository;
# commit/push as the App bot (<app-slug>[bot]). If either is absent, push with GITHUB_TOKEN as github-actions[bot].
# Commits pushed with GITHUB_TOKEN do not trigger workflows again; App tokens cause another run, which does not commit when the index is unchanged.
#
# concurrency serializes runs for the same branch; each run checks out the latest branch commit, so queued runs see the preceding bot commit.
name: Market publish index

on:
  workflow_call:
    secrets:
      MARKET_APP_CLIENT_ID:
        description: 推送索引提交用的 GitHub App client id；须与 MARKET_APP_PRIVATE_KEY 同时配置，缺省使用 GITHUB_TOKEN
        required: false
      MARKET_APP_PRIVATE_KEY:
        description: 推送索引提交用的 GitHub App private key；须与 MARKET_APP_CLIENT_ID 同时配置，缺省使用 GITHUB_TOKEN
        required: false

permissions:
  contents: read

concurrency:
  group: market-publish-index-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Commit and push regenerated arcreel-market.json.
    env:
      # secrets cannot be referenced directly in a step if; first derive non-secret boolean strings at job level.
      USE_APP_TOKEN: ${{ secrets.MARKET_APP_CLIENT_ID != '' && secrets.MARKET_APP_PRIVATE_KEY != '' }}
      APP_SECRETS_PARTIAL: ${{ (secrets.MARKET_APP_CLIENT_ID != '') != (secrets.MARKET_APP_PRIVATE_KEY != '') }}
    steps:
      - name: Require a branch ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/*) ;;
            *) echo "::error::market-publish-index must run on a branch push, got ${REF}"; exit 1 ;;
          esac

      - name: Warn on partial App secrets
        if: env.APP_SECRETS_PARTIAL == 'true'
        run: echo "::warning::Only one of MARKET_APP_CLIENT_ID / MARKET_APP_PRIVATE_KEY is set; pushing with GITHUB_TOKEN instead."

      - name: Checkout market source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: market
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Checkout ArcReel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArcReel/ArcReel
          ref: main
          path: arcreel
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install market tooling
        working-directory: arcreel
        # Install only the subpackage and its dependencies; scripts.market loads the pure Python translation catalog from checked-out source.
        run: uv sync --locked --no-dev --package arcreel-market-core

      - name: Generate index
        working-directory: arcreel
        run: |
          # If the existing index supplies no name, use the repository name rather than the checkout directory name.
          uv run --no-sync python -m scripts.market generate "${GITHUB_WORKSPACE}/market" --default-name "${GITHUB_REPOSITORY#*/}"

      - name: Check index
        working-directory: arcreel
        run: uv run --no-sync python -m scripts.market check "${GITHUB_WORKSPACE}/market"

      - name: Create App token
        id: app-token
        if: env.USE_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MARKET_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARKET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit index
        working-directory: market
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git add arcreel-market.json
          if git diff --cached --quiet; then
            echo "arcreel-market.json is up to date."
            exit 0
          fi
          if [ -n "$APP_SLUG" ]; then
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(GH_TOKEN="$PUSH_TOKEN" gh api "/users/${bot_name}" --jq .id)"
            bot_email="${bot_id}+${bot_name}@users.noreply.github.com"
          else
            bot_name="github-actions[bot]"
            bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git config user.name "$bot_name"
          git config user.email "$bot_email"
          git commit -m "chore: regenerate index"
          git push "https://x-access-token:${PUSH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
