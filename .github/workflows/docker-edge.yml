name: Docker Edge

# Build development images after merges to main: push immutable sha-* tags and the mutable main tag
# (some deployments track main). Formal releases use docker-release.yml.

on:
  push:
    branches: [main]
    # Paths affecting image contents: Dockerfile COPY sources and dependency files.
    paths:
      # Changes to this workflow must also exercise the publishing pipeline immediately after merge.
      - ".github/workflows/docker-edge.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "lib/**"
      - "packages/**"
      - "server/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/**"
      - "agent_runtime_profile/**"
      - "public/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: docker-edge
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # Generate APT_REFRESH by ISO week so the Dockerfile system-package layer expires weekly and reruns apt-get upgrade.
      - name: Compute apt refresh key
        id: apt
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Scan each platform digest from this build (branch tags are mutable; only digests identify the exact pushed content);
      # without a platform, multi-architecture manifests resolve only amd64, hiding arm64-only vulnerabilities.
      - name: Trivy vulnerability scan amd64 (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-amd64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy vulnerability scan arm64 (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_PLATFORM: linux/arm64
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-arm64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF amd64
        if: always() && hashFiles('trivy-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-image-amd64

      - name: Upload Trivy SARIF arm64
        if: always() && hashFiles('trivy-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-image-arm64
