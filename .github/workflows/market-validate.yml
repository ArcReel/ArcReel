# Market source validation (reusable workflow).
#
# Callers: ArcReel/arcreel-market and forks, triggered on PRs:
#
#   on:
#     pull_request:
#   jobs:
#     validate:
#       uses: ArcReel/ArcReel/.github/workflows/market-validate.yml@main
#
# Parameters: none. Permissions: contents: read (read the caller repository and public ArcReel/ArcReel).
# Validation rules come from the arcreel-market-core subpackage (packages/arcreel-market-core) on ArcReel/ArcReel main;
# the caller maintains no validation logic.
#
# The repository arcreel-market.json is a projection regenerated by market-publish-index after merge and is usually stale in a PR;
# therefore validate a candidate index regenerated from the PR catalog: generate and then check in a temporary copy, without committing.
# Differences between candidate and committed index go only to the job summary for review, not a failure condition.
name: Market validate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: market-validate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout market source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: market
          persist-credentials: false

      - name: Checkout ArcReel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArcReel/ArcReel
          ref: main
          path: arcreel
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: arcreel/uv.lock

      - name: Install market tooling
        working-directory: arcreel
        # Install only the subpackage and its dependencies; scripts.market loads the pure Python translation catalog from checked-out source.
        run: uv sync --locked --no-dev --package arcreel-market-core

      - name: Generate candidate index (dry run)
        working-directory: arcreel
        run: |
          candidate="${RUNNER_TEMP}/market-candidate"
          mkdir -p "$candidate"
          cp -R "${GITHUB_WORKSPACE}/market/." "$candidate/"
          rm -rf "$candidate/.git"
          # If the existing index supplies no name, use the repository name rather than the temporary directory name.
          uv run --no-sync python -m scripts.market generate "$candidate" --default-name "${GITHUB_REPOSITORY#*/}"

      - name: Check candidate
        working-directory: arcreel
        run: uv run --no-sync python -m scripts.market check "${RUNNER_TEMP}/market-candidate"

      - name: Summarize index changes
        run: |
          {
            # Do not follow symlinks: diff would write the link target’s contents into the summary.
            if [ -L market/arcreel-market.json ]; then
              echo "arcreel-market.json is a symbolic link; it will be replaced by a regular file after merge."
            elif [ ! -f market/arcreel-market.json ]; then
              echo "arcreel-market.json will be created after merge."
            elif diff -u --label committed --label candidate market/arcreel-market.json "${RUNNER_TEMP}/market-candidate/arcreel-market.json" > "${RUNNER_TEMP}/index.diff" 2>&1; then
              echo "arcreel-market.json is up to date."
            else
              echo "arcreel-market.json will be regenerated after merge:"
              echo
              echo '```diff'
              cat "${RUNNER_TEMP}/index.diff"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
