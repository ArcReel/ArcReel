name: project-status-sync

# Sync the org Project board Status field, derived one-way from triage labels, assignee, linked PRs, and open/closed state.
# issue/PR events sync one issue; daily schedules reconcile all. Rules live in scripts/project_status_sync.py.
on: # zizmor: ignore[dangerous-triggers]  # This rule checks trigger names only; checkout pins the default branch, never executes PR-branch code, and the script only reads API metadata.
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  # Use pull_request_target rather than pull_request: workflow and script run from the base branch,
  # keeping PR-branch code away from PROJECT_STATUS_SYNC_TOKEN.
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, edited]
  schedule:
    - cron: "30 21 * * *" # 05:30 Beijing time, full reconciliation
  workflow_dispatch:

concurrency:
  # Full reconciliation (schedule / dispatch / PR body edits) shares one serialized group;
  # single-entity runs group by event type + number, so equally numbered issues and PRs do not cancel each other.
  group: project-status-sync-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.action == 'edited') && 'all' || format('{0}-{1}', github.event_name, github.event.issue.number || github.event.pull_request.number) }}
  cancel-in-progress: true

# The script uses PROJECT_STATUS_SYNC_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs triggered by Dependabot cannot access repository Actions secrets.
    if: github.actor != 'dependabot[bot]'
    steps:
      # pull_request_target checks out the PR base branch by default, which can be any branch;
      # pin the default branch to avoid executing other branches’ scripts in a token-bearing environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync project status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_SYNC_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT_NAME" in
            issues) python3 scripts/project_status_sync.py --issue "$ISSUE_NUMBER" ;;
            pull_request_target)
              # Body edits can remove closing references; the current reference list omits removed issues, so reconcile all.
              if [ "$EVENT_ACTION" = "edited" ]; then
                python3 scripts/project_status_sync.py --all
              else
                python3 scripts/project_status_sync.py --pr "$PR_NUMBER"
              fi ;;
            *) python3 scripts/project_status_sync.py --all ;;
          esac
