name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full:
        description: 忽略路径裁剪，全量运行所有 job
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Codecov 上传令牌；缺失时覆盖率上传步骤不阻断
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.domains.outputs.workflow }}
      backend: ${{ steps.domains.outputs.backend }}
      frontend: ${{ steps.domains.outputs.frontend }}
      docker: ${{ steps.domains.outputs.docker }}
      website: ${{ steps.domains.outputs.website }}
      full: ${{ steps.scope.outputs.full }}
      coverage: ${{ steps.scope.outputs.coverage }}
      e2e_viewports: ${{ steps.scope.outputs.e2e_viewports }}
      e2e_shards: ${{ steps.scope.outputs.e2e_shards }}
      e2e_shard_total: ${{ steps.scope.outputs.e2e_shard_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide run scope
        # 分片数按每片约 115 条用例定：单 worker 下 2560×1440 一档约 3 秒一条，最慢一片约 7 分钟，
        # 与 Backend tests (integration) 相当。三档 921 条分 8 片，五档 1521 条分 13 片。
        # 用例数明显变化时重算。
        id: scope
        env:
          FULL: ${{ inputs.full == true || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$FULL" == "true" ]]; then
            viewports=all
            shard_total=13
          else
            viewports=screenshot
            shard_total=8
          fi
          if [[ "$FULL" == "true" || "$EVENT_NAME" != "pull_request" ]]; then
            coverage=true
          else
            coverage=false
          fi
          {
            echo "full=$FULL"
            echo "coverage=$coverage"
            echo "e2e_viewports=$viewports"
            echo "e2e_shards=$(jq -cn --argjson total "$shard_total" '[range(1; $total + 1)]')"
            echo "e2e_shard_total=$shard_total"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/domain-filter
        id: domains
        with:
          full: ${{ steps.scope.outputs.full }}

  workflow-static:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow syntax & shell check (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Workflow security audit (zizmor)
        run: uvx zizmor@1.29.0 --offline --min-severity medium .github .pre-commit-config.yaml

  backend-static:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Classification marker gate (collect-only)
        # 必须不带 -n：xdist 的收集发生在各 worker 内，conftest 的 UsageError 会撞上
        # dsession 断言并丢失违规清单。-qq 保留收集错误且避免输出上万条 nodeid。
        run: uv run python -m pytest --collect-only -qq

      - name: Lint & format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright --warnings

      - name: Import layering (import-linter)
        run: uv run lint-imports

      - name: Dependency hygiene (deptry)
        run: uv run deptry lib server alembic scripts tests

      - name: Dependency hygiene (deptry, arcreel-market-core)
        working-directory: packages/arcreel-market-core
        run: uv run deptry src tests

      - name: Dependency hygiene (deptry, arcreel-catalog-core)
        working-directory: packages/arcreel-catalog-core
        run: uv run deptry src tests

      - name: Agent Runtime Profile integrity
        run: uv run python scripts/lint_agent_runtime_profile.py

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Repository conventions (audit_conventions --check)
        run: uv run python scripts/audit_conventions.py --check

      - name: Source comment ratchet (ARC001)
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        if: env.COMMENT_BASE != '' && env.COMMENT_BASE != '0000000000000000000000000000000000000000'
        run: |
          if ! git cat-file -e "${COMMENT_BASE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$COMMENT_BASE"
          fi
          uv run python -m scripts.audit_comments --base "$COMMENT_BASE"

  test-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test hygiene gate (audit_tests --check)
        run: python scripts/audit_tests.py --check

  backend-tests:
    name: Backend tests (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
            extra_args: --blocking-guard-expect-all-exemptions
          - suite: integration
            path: tests/integration
          - suite: market-core
            path: packages/arcreel-market-core/tests
          - suite: catalog-core
            path: packages/arcreel-catalog-core/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: matrix.suite == 'integration'
        run: sudo apt-get update && sudo apt-get install -y mediainfo bubblewrap socat

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # -n 固定 4 而非 auto：-n auto 优先取 psutil 的物理核数，一旦某传递依赖带进
        # psutil，CI worker 数会静默减半。loadfile 而非默认 load：仓库根共享路径
        # （PROJECT_ROOT 下 mkdir/rmdir、module 级 autouse fixture）要求同文件用例
        # 留在同一 worker。
        # --max-worker-restart=0：worker 崩溃后不补新 worker，直接失败并报出崩溃时在跑的用例。
        # 锁定的 pytest-xdist 补 worker 时会把崩溃 worker 已跑完的文件重新排队，补上的 worker
        # 领到空任务后会话卡在 99%；何时可以去掉见 docs/agents/testing.md「CI 挂起诊断」。
        # 步骤超时短于 job 超时，挂起时留出时间给下一步输出诊断。
        timeout-minutes: 20
        env:
          ARCREEL_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/pytest-hang
          COVERAGE: ${{ needs.changes.outputs.coverage }}
          SUITE: ${{ matrix.suite }}
        run: |
          coverage_args=()
          if [[ "$COVERAGE" == "true" ]]; then
            coverage_args=(
              --cov=lib --cov=server --cov=arcreel_market_core --cov=arcreel_catalog_core
              --cov-report=term-missing "--cov-report=xml:coverage-${SUITE}.xml"
            )
          fi
          uv run python -m pytest ${{ matrix.path }} ${{ matrix.extra_args }} \
            -n 4 --dist loadfile --max-worker-restart=0 "${coverage_args[@]}"

      - name: Hang and crash diagnostics
        if: failure() || cancelled()
        env:
          DUMP_DIR: ${{ runner.temp }}/pytest-hang
        run: |
          shopt -s nullglob
          for f in "$DUMP_DIR"/*.progress; do
            echo "::group::$(basename "$f") 最后的进展"
            tail -n 5 "$f"
            echo "::endgroup::"
          done
          for f in "$DUMP_DIR"/*.stacks "$DUMP_DIR"/*.SIG*; do
            [ -s "$f" ] || continue
            echo "===== $(basename "$f")"
            cat "$f"
          done
          sudo dmesg --ctime | grep -iE 'out of memory|oom|killed process|segfault' || echo "内核日志里没有 OOM 或段错误记录"

      - name: Upload backend coverage
        # unit/integration 使用同一 flag；Codecov 按 commit 合并，无需本地聚合作业。
        if: needs.changes.outputs.coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-${{ matrix.suite }}.xml
          flags: backend
          fail_ci_if_error: false

  postgres-compat:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcreel
          POSTGRES_PASSWORD: arcreel
          POSTGRES_DB: arcreel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://arcreel:arcreel@localhost:5432/arcreel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Validate alembic migrations (upgrade / idempotent / downgrade / re-upgrade)
        run: |
          set -e
          uv run alembic upgrade head
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run dialect-sensitive tests against Postgres
        env:
          COVERAGE: ${{ needs.changes.outputs.coverage }}
        run: |
          coverage_args=()
          if [[ "$COVERAGE" == "true" ]]; then
            coverage_args=(--cov=lib --cov=server --cov-report=xml:coverage-pg.xml)
          fi
          uv run python -m pytest -v \
            -m "uses_db and not sqlite_only" \
            -n 4 --dist loadfile --max-worker-restart=0 "${coverage_args[@]}"

      - name: Upload PG coverage
        if: needs.changes.outputs.coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-pg.xml
          flags: postgres
          fail_ci_if_error: false

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Knip
        working-directory: frontend
        run: pnpm knip

      - name: Build
        working-directory: frontend
        run: pnpm build

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        env:
          COVERAGE: ${{ needs.changes.outputs.coverage }}
        run: |
          if [[ "$COVERAGE" == "true" ]]; then
            pnpm test:coverage
          else
            pnpm test
          fi

      - name: Upload frontend coverage
        if: needs.changes.outputs.coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-e2e:
    # 页面级验收套件（溢出探针 + axe + 区域截图比对）。镜像版本必须与 frontend/package.json 的
    # @playwright/test 一致，否则找不到浏览器；升级 @playwright/test 时同步改这里。
    name: frontend-e2e (${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run page-level suite
        working-directory: frontend
        env:
          E2E_SCREENSHOTS: "1"
          E2E_VIEWPORTS: ${{ needs.changes.outputs.e2e_viewports }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shard_total }}
        run: pnpm e2e --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

  e2e-record-drift:
    name: E2E fixture recording drift
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync

      - name: Record twice and compare
        working-directory: frontend
        run: node e2e/record-fixtures.ts --check

  website-checks:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # 版本取自 website/package.json 的 packageManager（含完整性哈希），不在此重复写死；
          # 该输入必须显式指定——默认值是仓库根的 package.json，本仓库根目录没有这个文件
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Website checks including translation consistency
        working-directory: website
        run: pnpm check

      - name: Build (zh-Hans + en)
        working-directory: website
        run: pnpm run build

  docker-verify:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arcreel-ci:verify
          cache-from: type=gha

      - name: Allow unprivileged user namespaces on runner host
        # Ubuntu 24.04 默认 kernel.apparmor_restrict_unprivileged_userns=1 全局
        # 禁用非特权 userns，容器内 bwrap 起不来且 apparmor:unconfined 绕不过，
        # 只能在宿主（runner VM）侧放开
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test container health
        run: |
          docker run -d --name arcreel-ci \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add NET_ADMIN \
            -e AUTH_USERNAME=ci \
            -e AUTH_PASSWORD=ci-password \
            -e AUTH_TOKEN_SECRET=ci-token-secret \
            -p 1241:1241 arcreel-ci:verify
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:1241/health >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "container failed to become healthy"
          docker logs arcreel-ci
          exit 1

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: arcreel-ci:verify
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  release-integrity:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Lockfile consistency
        run: uv lock --check

      - name: Version consistency (pyproject / package.json / manifest)
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              py = tomllib.load(f)["project"]["version"]
          with open("frontend/package.json", encoding="utf-8") as f:
              fe = json.load(f)["version"]
          with open(".release-please-manifest.json", encoding="utf-8") as f:
              mf = json.load(f)["."]
          print(f"pyproject={py} package.json={fe} manifest={mf}")
          sys.exit(0 if py == fe == mf else 1)
          EOF

  ci-required:
    if: always()
    needs:
      [
        changes,
        workflow-static,
        backend-static,
        conventions,
        test-lint,
        backend-tests,
        postgres-compat,
        frontend-static,
        frontend-tests,
        frontend-e2e,
        e2e-record-drift,
        docker-verify,
        website-checks,
        release-integrity,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped (domain not affected)"
