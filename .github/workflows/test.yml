name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full:
        description: 忽略路径裁剪，全量运行所有 job
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      recording: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.recording || 'false' }}
      workflow: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.workflow || 'false' }}
      backend: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.backend || 'false' }}
      frontend: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.frontend || 'false' }}
      docker: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.docker || 'false' }}
      website: ${{ steps.reuse.outputs.reused != 'true' && steps.domains.outputs.website || 'false' }}
      full: ${{ steps.scope.outputs.full }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide run scope
        id: scope
        env:
          FULL: ${{ inputs.full == true || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/domain-filter
        id: domains
        with:
          full: ${{ steps.scope.outputs.full }}
      - name: PR checkout ${{ github.event.number }} ${{ github.sha }}
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify equivalent PR checks
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.forced && steps.scope.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          DOMAINS: ${{ toJSON(steps.domains.outputs) }}
        run: python3 scripts/ci_reuse.py || echo "reused=false" >> "$GITHUB_OUTPUT"
      - name: Observe static gate changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git diff --name-only --no-renames -z HEAD^1 HEAD | python3 scripts/observe_gates.py >> "$GITHUB_STEP_SUMMARY"

  workflow-static:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow syntax & shell check (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Workflow security audit (zizmor)
        run: uvx zizmor@1.29.0 --offline --min-severity medium .github .pre-commit-config.yaml

  backend-static:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Classification marker gate (collect-only)
        # 必须不带 -n：xdist 的收集发生在各 worker 内，conftest 的 UsageError 会撞上
        # dsession 断言并丢失违规清单。-qq 保留收集错误且避免输出上万条 nodeid。
        run: uv run python -m pytest --collect-only --assert=plain -qq

      - name: Lint & format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Capability error codes and template parameters
        run: uv run python -m scripts.audit_capability_codes

      - name: Type check (basedpyright)
        run: uv run basedpyright --warnings

      - name: Import layering (import-linter)
        run: uv run lint-imports

      - name: Dependency hygiene (deptry)
        run: uv run deptry lib server alembic scripts tests

      - name: Dependency hygiene (deptry, arcreel-market-core)
        working-directory: packages/arcreel-market-core
        run: uv run deptry src tests

      - name: Dependency hygiene (deptry, arcreel-catalog-core)
        working-directory: packages/arcreel-catalog-core
        run: uv run deptry src tests

      - name: Agent Runtime Profile integrity
        run: uv run python scripts/lint_agent_runtime_profile.py

  conventions:
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Repository conventions (audit_conventions --check)
        run: uv run python scripts/audit_conventions.py --check

      - name: Source comment ratchet (ARC001)
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        if: env.COMMENT_BASE != '' && env.COMMENT_BASE != '0000000000000000000000000000000000000000'
        run: |
          if ! git cat-file -e "${COMMENT_BASE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$COMMENT_BASE"
          fi
          uv run python -m scripts.audit_comments --base "$COMMENT_BASE"

  test-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test hygiene gate (audit_tests --check)
        run: python scripts/audit_tests.py --check

  backend-tests:
    name: Backend tests (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
            extra_args: --blocking-guard-expect-all-exemptions
          - suite: integration
            path: tests/integration
          - suite: market-core
            path: packages/arcreel-market-core/tests
          - suite: catalog-core
            path: packages/arcreel-catalog-core/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: matrix.suite == 'integration'
        run: sudo apt-get update && sudo apt-get install -y mediainfo bubblewrap socat

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # -n 固定 4 而非 auto：-n auto 优先取 psutil 的物理核数，一旦某传递依赖带进
        # psutil，CI worker 数会静默减半。loadfile 而非默认 load：仓库根共享路径
        # （PROJECT_ROOT 下 mkdir/rmdir、module 级 autouse fixture）要求同文件用例
        # 留在同一 worker。
        # --max-worker-restart=0：worker 崩溃后不补新 worker，直接失败并报出崩溃时在跑的用例。
        # 锁定的 pytest-xdist 补 worker 时会把崩溃 worker 已跑完的文件重新排队，补上的 worker
        # 领到空任务后会话卡在 99%；何时可以去掉见 docs/agents/testing.md「CI 挂起诊断」。
        # 步骤超时短于 job 超时，挂起时留出时间给下一步输出诊断。
        timeout-minutes: 20
        env:
          ARCREEL_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/pytest-hang
        run: |
          uv run python -m pytest ${{ matrix.path }} ${{ matrix.extra_args }} \
            -n 4 --dist loadfile --max-worker-restart=0

      - name: Hang and crash diagnostics
        if: failure() || cancelled()
        env:
          DUMP_DIR: ${{ runner.temp }}/pytest-hang
        run: bash .github/scripts/pytest-diagnostics.sh

  postgres-compat:
    name: postgres-compat (${{ matrix.postgres }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[16,17,18]' || '[16]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: arcreel
          POSTGRES_PASSWORD: arcreel
          POSTGRES_DB: arcreel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://arcreel:arcreel@localhost:5432/arcreel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Validate alembic migrations (upgrade / idempotent / downgrade / re-upgrade)
        run: |
          set -e
          uv run alembic upgrade head
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run dialect-sensitive tests against Postgres
        run: uv run python -m pytest -v -m "uses_db and not sqlite_only" -n 4 --dist loadfile --max-worker-restart=0

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Knip
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm knip

      - name: Build
        working-directory: frontend
        run: |
          pnpm build
          node e2e/build-artifact.ts pack "$RUNNER_TEMP/browser-build"

      - name: Upload shared browser build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/browser-build/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test

  frontend-e2e:
    name: frontend-e2e (${{ matrix.shard }}/2)
    needs: [changes, frontend-static]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: ./.github/actions/restore-browser-build

      - name: Run page-level suite
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}/2
        run: node node_modules/@playwright/test/cli.js test --grep-invert "@viewport-contract" --shard="$SHARD"

      - name: Run single-worker viewport contracts
        if: matrix.shard == 1
        working-directory: frontend
        run: node node_modules/@playwright/test/cli.js test --project=viewport-contracts --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

  e2e-live:
    needs: [changes, frontend-static]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: ./.github/actions/restore-browser-build

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install browser and backend dependencies
        working-directory: frontend
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv sync --frozen

      - name: Run live business flows
        working-directory: frontend
        shell: bash
        env:
          E2E_LIVE: "1"
        run: |
          set -o pipefail
          node node_modules/@playwright/test/cli.js test --project=live --global-timeout=180000 2>&1 | tee "$RUNNER_TEMP/e2e-live.log"

      - name: Upload live diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-diagnostics
          path: |
            ${{ runner.temp }}/e2e-live.log
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  e2e-record-drift:
    name: E2E fixture freshness and determinism
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync

      - name: Compare committed fixtures with current backend
        working-directory: frontend
        run: node e2e/record-fixtures.ts --freshness

      - name: Record twice and compare
        if: needs.changes.outputs.recording == 'true'
        working-directory: frontend
        run: node e2e/record-fixtures.ts --check

  website-checks:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # 版本取自 website/package.json 的 packageManager（含完整性哈希），不在此重复写死；
          # 该输入必须显式指定——默认值是仓库根的 package.json，本仓库根目录没有这个文件
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Website checks including translation consistency
        working-directory: website
        run: pnpm check

      - name: Build (zh-Hans + en)
        working-directory: website
        run: pnpm run build

  docker-verify:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arcreel-ci:verify
          cache-from: type=gha

      - name: Allow unprivileged user namespaces on runner host
        # Ubuntu 24.04 默认 kernel.apparmor_restrict_unprivileged_userns=1 全局
        # 禁用非特权 userns，容器内 bwrap 起不来且 apparmor:unconfined 绕不过，
        # 只能在宿主（runner VM）侧放开
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test container health
        run: |
          docker run -d --name arcreel-ci \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add NET_ADMIN \
            -e AUTH_USERNAME=ci \
            -e AUTH_PASSWORD=ci-password \
            -e AUTH_TOKEN_SECRET=ci-token-secret \
            -p 1241:1241 arcreel-ci:verify
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:1241/health >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "container failed to become healthy"
          docker logs arcreel-ci
          exit 1

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: arcreel-ci:verify
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  release-integrity:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Lockfile consistency
        run: uv lock --check

      - name: Version consistency (pyproject / package.json / manifest)
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              py = tomllib.load(f)["project"]["version"]
          with open("frontend/package.json", encoding="utf-8") as f:
              fe = json.load(f)["version"]
          with open(".release-please-manifest.json", encoding="utf-8") as f:
              mf = json.load(f)["."]
          print(f"pyproject={py} package.json={fe} manifest={mf}")
          sys.exit(0 if py == fe == mf else 1)
          EOF

  ci-required:
    if: always()
    needs:
      [
        changes,
        workflow-static,
        backend-static,
        conventions,
        test-lint,
        backend-tests,
        postgres-compat,
        frontend-static,
        frontend-tests,
        frontend-e2e,
        e2e-live,
        e2e-record-drift,
        docker-verify,
        website-checks,
        release-integrity,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required jobs
        env:
          JOBS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_required
