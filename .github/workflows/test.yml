name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full:
        description: 忽略路径裁剪，全量运行所有 job
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Codecov 上传令牌；缺失时覆盖率上传步骤不阻断
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.domains.outputs.workflow }}
      backend: ${{ steps.domains.outputs.backend }}
      frontend: ${{ steps.domains.outputs.frontend }}
      docker: ${{ steps.domains.outputs.docker }}
      website: ${{ steps.domains.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/domain-filter
        id: domains
        with:
          # Release PR version-file changes do not match the docker domain; explicitly run everything to fulfill full CI on release commits.
          full: ${{ inputs.full == true || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}

  workflow-static:
    # Workflow syntax/security gate. The official actionlint container includes shellcheck and
    # pyflakes for run: scripts; zizmor uses its default persona, blocking medium severity and above. --offline
    # makes results independent of whether a GitHub token exists in the environment, matching local pre-commit.
    # Upgrade both tool versions together with their hooks in .pre-commit-config.yaml.
    # zizmor audits only inputs GitHub actually executes; upstream CI bundled in vendored .agents/skills/ does not run here.
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow syntax & shell check (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Workflow security audit (zizmor)
        run: uvx zizmor@1.29.0 --offline --min-severity medium .github .pre-commit-config.yaml

  backend-static:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Classification marker gate (collect-only)
        # Must omit -n: xdist collects inside workers; conftest UsageError would hit the
        # dsession assertion and lose the violation list. -qq retains collection errors without thousands of nodeids.
        run: uv run python -m pytest --collect-only -qq

      - name: Lint & format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright --warnings

      - name: Import layering (import-linter)
        run: uv run lint-imports

      - name: Dependency hygiene (deptry)
        run: uv run deptry lib server alembic scripts tests

      - name: Dependency hygiene (deptry, arcreel-market-core)
        working-directory: packages/arcreel-market-core
        run: uv run deptry src tests

      - name: Dependency hygiene (deptry, arcreel-catalog-core)
        working-directory: packages/arcreel-catalog-core
        run: uv run deptry src tests

      - name: Agent Runtime Profile integrity
        run: uv run python scripts/lint_agent_runtime_profile.py

  conventions:
    # Repository convention gate: scripts/audit_conventions.py --check (standards index and CodeRabbit mapping,
    # Dependabot groups, synchronized tool versions, and inline reasons for exemptions). Its files span domains, and
    # docs/standards/ is outside every domain, so do not filter by domain.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Repository conventions (audit_conventions --check)
        run: uv run python scripts/audit_conventions.py --check

  test-lint:
    # Test-hygiene gate: scripts/audit_tests.py --check (stdlib ast only, no third-party dependencies).
    # Independent of backend-static: the script scans both backend tests/ and frontend/src/**/*.test.*;
    # restricting it to backend would let frontend-only PRs bypass its frontend checks.
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test hygiene gate (audit_tests --check)
        run: python scripts/audit_tests.py --check

  backend-tests:
    name: Backend tests (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every exemption-list entry is exercised by tests/unit: the unit job declares this so CI reports expired entries;
          # integration alone exercises only some entries, so it omits the declaration.
          - suite: unit
            path: tests/unit
            extra_args: --blocking-guard-expect-all-exemptions
          - suite: integration
            path: tests/integration
          # Workspace subpackages have their own pytest configuration; collect their tests separately from application tests.
          - suite: market-core
            path: packages/arcreel-market-core/tests
          - suite: catalog-core
            path: packages/arcreel-catalog-core/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: matrix.suite == 'integration'
        run: sudo apt-get update && sudo apt-get install -y mediainfo bubblewrap socat

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        # Fix -n at 4 rather than auto: -n auto prefers psutil physical cores; if a transitive dependency introduces
        # psutil, CI workers silently halve. Use loadfile rather than default load: shared repository-root paths
        # (mkdir/rmdir under PROJECT_ROOT, module-level autouse fixtures) require tests within each file
        # to stay on the same worker.
        # --max-worker-restart=0: do not replace crashed workers; fail immediately and report the test running at the crash.
        # The pinned pytest-xdist requeues files already completed by a crashed worker when replacing it; the new worker
        # receives an empty task and hangs at 99%. Removal conditions: docs/agents/testing.md, “CI hang diagnosis”.
        # Step timeout is shorter than job timeout, leaving time for the next step to print diagnostics after a hang.
        timeout-minutes: 20
        env:
          ARCREEL_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/pytest-hang
        run: >-
          uv run python -m pytest ${{ matrix.path }} ${{ matrix.extra_args }} -n 4 --dist loadfile --max-worker-restart=0
          --cov=lib --cov=server --cov=arcreel_market_core --cov=arcreel_catalog_core --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.suite }}.xml

      - name: Hang and crash diagnostics
        # tests/hang_watchdog.py records each process’s latest progress (started test and sessionfinish/unconfigure phases) and thread stacks on inactivity;
        # a final phase record means the process completed its session; a final test record identifies the test where it is stuck.
        # When a worker goes down (node down: Not properly terminated), controller progress records its exit code or termination signal;
        # workers dying through os._exit leave call stacks in .stacks; processes receiving SIGTERM/SIGHUP/SIGINT leave stacks
        # in same-named .SIGTERM etc. files. Segfault stacks appear in test stderr (Fatal Python error;
        # absent if faulthandler could not run). For SIGKILL, inspect kernel logs for OOM.
        if: failure() || cancelled()
        env:
          DUMP_DIR: ${{ runner.temp }}/pytest-hang
        run: |
          shopt -s nullglob
          for f in "$DUMP_DIR"/*.progress; do
            echo "::group::$(basename "$f") 最后的进展"
            tail -n 5 "$f"
            echo "::endgroup::"
          done
          for f in "$DUMP_DIR"/*.stacks "$DUMP_DIR"/*.SIG*; do
            [ -s "$f" ] || continue
            echo "===== $(basename "$f")"
            cat "$f"
          done
          sudo dmesg --ctime | grep -iE 'out of memory|oom|killed process|segfault' || echo "内核日志里没有 OOM 或段错误记录"

      - name: Upload backend coverage
        # unit/integration use the same flag; Codecov merges by commit, so no local aggregation job is needed.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-${{ matrix.suite }}.xml
          flags: backend
          fail_ci_if_error: false

  postgres-compat:
    # SQLite/PostgreSQL dialect-compatibility gate: three-step alembic cycle (upgrade/downgrade/idempotent)
    # plus all DB-touching tests (marker-driven) on PG16.
    # Bind to backend rather than a separate database domain: any SQLAlchemy query change can introduce dialect differences,
    # not only changes under alembic/.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcreel
          POSTGRES_PASSWORD: arcreel
          POSTGRES_DB: arcreel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://arcreel:arcreel@localhost:5432/arcreel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Validate alembic migrations (upgrade / idempotent / downgrade / re-upgrade)
        run: |
          set -e
          uv run alembic upgrade head           # 1. Forward migration
          uv run alembic upgrade head           # 2. Idempotency: the second call should be a no-op
          uv run alembic downgrade base         # 3. Reverse to an empty schema
          uv run alembic upgrade head           # 4. Forward again, verifying downgrade really removed everything

      - name: Run dialect-sensitive tests against Postgres
        # 4 workers + loadfile: independent-schema tests can run in parallel; async_session tests sharing public schema
        # stay in the same file/worker to avoid primary-key and lock conflicts.
        run: |
          uv run python -m pytest -v \
            -m "uses_db and not sqlite_only" \
            -n 4 --dist loadfile --max-worker-restart=0 \
            --cov=lib --cov=server --cov-report=xml:coverage-pg.xml

      - name: Upload PG coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-pg.xml
          flags: postgres
          fail_ci_if_error: false

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Knip
        working-directory: frontend
        run: pnpm knip

      - name: Build
        working-directory: frontend
        run: pnpm build

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-e2e:
    # Page-level acceptance suite (overflow probes + axe + region screenshot comparison). The image version must match
    # @playwright/test in frontend/package.json, or browsers cannot be found; update this when upgrading @playwright/test.
    name: frontend-e2e (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Split tests into five shards; each remains single-worker, preserving screenshot rendering conditions.
    # Shard count appears in job names, matrix.shard, and --shard; update all three together.
    # The 25-minute limit only guards against hangs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run page-level suite
        working-directory: frontend
        # Screenshot baselines use the same image; differences or missing baselines fail the shard.
        env:
          E2E_SCREENSHOTS: "1"
        run: pnpm e2e --shard=${{ matrix.shard }}/5

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

  website-checks:
    # One job chains documentation-site gates: static checks (typecheck / eslint / prettier) run first,
    # failing within seconds rather than waiting for builds → copy CONTRIBUTING (otherwise its gitignored Chinese copy is absent and the committed
    # English translation appears orphaned) → consistency script (page inventory / orphan translations / missing anchors / complete UI JSON keys;
    # see website/scripts/check-consistency.mjs) fails →
    # dual-locale build (onBrokenLinks/onBrokenAnchors/onBrokenMarkdownLinks all throw)
    # fails → missing/stale translation lists enter the step summary without blocking.
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Read the version from website/package.json packageManager (including integrity hash), without duplicating it here;
          # this input must be explicit: the default is root package.json, which this repository does not have.
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: translate-docs script unit tests
        run: node --test .claude/skills/translate-docs/scripts/translation-lock.test.mjs .claude/skills/translate-docs/scripts/ui-messages.test.mjs

      - name: Website script unit tests
        run: node --test website/scripts/*.test.mjs

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      # Immediately after dependency installation: even if a later gate fails, the always() translation-staleness report needs this synchronized copy.
      - name: Sync CONTRIBUTING copy
        working-directory: website
        run: pnpm run sync-contributing

      - name: Typecheck
        working-directory: website
        run: pnpm run typecheck

      - name: Lint
        working-directory: website
        run: pnpm run lint

      - name: Format check
        working-directory: website
        run: pnpm run format:check

      - name: Consistency check (doc inventory / orphan translations / anchors / UI JSON keys)
        working-directory: website
        run: pnpm run check-consistency

      - name: Build (zh-Hans + en)
        working-directory: website
        run: pnpm run build

      - name: Translation lag report
        # This report is nonblocking and must not be swallowed by earlier gates: PRs with failed gates must also see missing/stale translations.
        if: always()
        run: |
          {
            echo "### 文档翻译滞后清单"
            echo
            echo '```'
            node .claude/skills/translate-docs/scripts/translation-lock.mjs status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-verify:
    # PR-stage image-assembly validation: build amd64 only, without login or push.
    # Backend/frontend tests ensure application correctness; this only verifies image build, container startup, and
    # /health reachability. Trivy reports without blocking (release blocking lives in docker-release.yml).
    # Pin runner to 24.04: sysctl keys and semantics below assume that version; -latest drift could fail
    # the job before its health check.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arcreel-ci:verify
          cache-from: type=gha

      - name: Allow unprivileged user namespaces on runner host
        # Ubuntu 24.04 defaults kernel.apparmor_restrict_unprivileged_userns=1, globally
        # disabling unprivileged userns. Container bwrap cannot start and apparmor:unconfined cannot bypass this;
        # relax it on the host (runner VM).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test container health
        run: |
          # Sandbox runtime parameters match official Compose (website/docs/ops/deployment.md): container bwrap
          # needs these permissions; without them the server fails startup under sandbox safety requirements.
          docker run -d --name arcreel-ci \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add NET_ADMIN \
            -e AUTH_USERNAME=ci \
            -e AUTH_PASSWORD=ci-password \
            -e AUTH_TOKEN_SECRET=ci-token-secret \
            -p 1241:1241 arcreel-ci:verify
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:1241/health >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "container failed to become healthy"
          docker logs arcreel-ci
          exit 1

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: arcreel-ci:verify
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  release-integrity:
    # Release PR integrity validation (release-please--* branches); skip otherwise (treated as passing by aggregation).
    # Release PRs also run full CI: this commit is about to be tagged and released, so its branch prefix must not bypass tests.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Lockfile consistency
        run: uv lock --check

      - name: Version consistency (pyproject / package.json / manifest)
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              py = tomllib.load(f)["project"]["version"]
          with open("frontend/package.json", encoding="utf-8") as f:
              fe = json.load(f)["version"]
          with open(".release-please-manifest.json", encoding="utf-8") as f:
              mf = json.load(f)["."]
          print(f"pyproject={py} package.json={fe} manifest={mf}")
          sys.exit(0 if py == fe == mf else 1)
          EOF

      - name: Changed files whitelist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          allow='^(CHANGELOG\.md|pyproject\.toml|uv\.lock|frontend/package\.json|\.release-please-manifest\.json|lib/catalog/snapshot/(catalog|manifest)\.json)$'
          bad=$(echo "$changed" | grep -vE "$allow" || true)
          if [ -n "$bad" ]; then
            echo "发布 PR 含版本产物白名单外的文件，请检查 release-please 配置："
            echo "$bad"
            exit 1
          fi
          echo "发布 PR 变更文件均在白名单内"

  ci-required:
    if: always()
    needs:
      [
        changes,
        workflow-static,
        backend-static,
        conventions,
        test-lint,
        backend-tests,
        postgres-compat,
        frontend-static,
        frontend-tests,
        frontend-e2e,
        docker-verify,
        website-checks,
        release-integrity,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped (domain not affected)"
