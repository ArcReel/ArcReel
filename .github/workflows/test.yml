name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full:
        description: 忽略路径裁剪，全量运行所有 job
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.domains.outputs.backend }}
      frontend: ${{ steps.domains.outputs.frontend }}
      docker: ${{ steps.domains.outputs.docker }}
      website: ${{ steps.domains.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/domain-filter
        id: domains
        with:
          # 发布 PR 变更的版本文件不覆盖 docker 域，须显式全量以兑现「发布 commit 跑全量 CI」
          full: ${{ inputs.full == true || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) }}

  backend-static:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint & format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Import layering (import-linter)
        run: uv run lint-imports

      - name: Agent Runtime Profile integrity
        run: uv run python scripts/lint_agent_runtime_profile.py

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mediainfo bubblewrap socat

      - name: Install dependencies
        run: uv sync

      - name: Classification marker gate (collect-only)
        # 必须在并行步骤之前、且不带 -n：xdist 的收集发生在各 worker 内，conftest
        # 的 UsageError 会撞上 dsession 的断言退化成 INTERNALERROR，违规清单一个字
        # 都不剩。--collect-only 由 controller 本地收集，清单完整、全量约 2s。
        run: uv run python -m pytest --collect-only -q

      - name: Run tests with coverage
        # -n 固定 4 而非 auto：-n auto 优先取 psutil 的物理核数，一旦某传递依赖带进
        # psutil，CI worker 数会静默减半。loadfile 而非默认 load：仓库根共享路径
        # （PROJECT_ROOT 下 mkdir/rmdir、module 级 autouse fixture）要求同文件用例
        # 留在同一 worker。
        run: uv run python -m pytest -m "not e2e" -n 4 --dist loadfile --cov=lib --cov=server --cov-report=term-missing --cov-report=xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false

  postgres-compat:
    # SQLite/PostgreSQL 方言兼容性闸门：alembic 三步闭环（upgrade/downgrade/idempotent）
    # + 所有 DB-touching 测试（marker 驱动）跑在 PG16 上。
    # 绑定 backend 域而非独立的 database 域：方言差异可由任何 SQLAlchemy 查询改动引入，
    # 不限于 alembic/ 目录。
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcreel
          POSTGRES_PASSWORD: arcreel
          POSTGRES_DB: arcreel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://arcreel:arcreel@localhost:5432/arcreel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Validate alembic migrations (upgrade / idempotent / downgrade / re-upgrade)
        run: |
          set -e
          uv run alembic upgrade head           # 1. 正向迁移
          uv run alembic upgrade head           # 2. 幂等性：第二次应该 no-op
          uv run alembic downgrade base         # 3. 反向回到空 schema
          uv run alembic upgrade head           # 4. 再次正向，验证 downgrade 真清掉了

      - name: Run dialect-sensitive tests against Postgres
        # 保持单进程：92 个用例约 2m44s，可省时间小于并行风险——其中
        # tests/test_agent_credential_repo.py 的用例共用 alembic 建出的 public
        # schema，两 worker 写同一主键会互相阻塞。
        run: |
          uv run python -m pytest -v \
            -m "uses_db and not sqlite_only" \
            --cov=lib --cov=server --cov-report=xml:coverage-pg.xml

      - name: Upload PG coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-pg.xml
          flags: postgres
          fail_ci_if_error: false

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  website-checks:
    # 单一 job 串起文档站的各道闸：静态检查（typecheck / eslint / prettier）前置，
    # 秒级失败不必等构建 → CONTRIBUTING 复制（否则 gitignore 的中文副本缺席，其已提交
    # 的英文译文会被误判为孤儿）→ 一致性脚本（页面库存 / 孤儿译文 / 缺锚点 / UI JSON key 齐全性，
    # 见 website/scripts/check-consistency.mjs）fail →
    # 双 locale build（onBrokenLinks/onBrokenAnchors/onBrokenMarkdownLinks 均 throw）
    # fail → 缺译/滞后清单写 step summary，不阻断。
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # 版本取自 website/package.json 的 packageManager（含完整性哈希），不在此重复写死；
          # 该输入必须显式指定——默认值是仓库根的 package.json，本仓库根目录没有这个文件
          package_json_file: website/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.node-version
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Translation lock unit tests
        run: node --test .claude/skills/translate-docs/scripts/translation-lock.test.mjs

      - name: Website script unit tests
        run: node --test website/scripts/*.test.mjs

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: website
        run: pnpm run typecheck

      - name: Lint
        working-directory: website
        run: pnpm run lint

      - name: Format check
        working-directory: website
        run: pnpm run format:check

      - name: Sync CONTRIBUTING copy
        working-directory: website
        run: pnpm run sync-contributing

      - name: Consistency check (doc inventory / orphan translations / anchors / UI JSON keys)
        working-directory: website
        run: pnpm run check-consistency

      - name: Build (zh-Hans + en)
        working-directory: website
        run: pnpm run build

      - name: Translation lag report
        # 报告不阻断，也不该被前面的闸门吞掉：闸门红了的 PR 同样要看到缺译/滞后清单
        if: always()
        run: |
          {
            echo "### 文档翻译滞后清单"
            echo
            echo '```'
            node .claude/skills/translate-docs/scripts/translation-lock.mjs status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-verify:
    # PR 阶段的镜像装配验证：只构建 amd64、不登录、不推送。
    # 应用正确性由 backend/frontend 测试保证，这里只验证镜像能构建、容器能起、
    # /health 可达；Trivy 仅上报不阻断（发布级阻断在 docker-release.yml）。
    # runner 固定 24.04：下方 sysctl 键与语义按该版本假设，-latest 漂移会在
    # 健康检查前把 job 打红
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arcreel-ci:verify
          cache-from: type=gha

      - name: Allow unprivileged user namespaces on runner host
        # Ubuntu 24.04 默认 kernel.apparmor_restrict_unprivileged_userns=1 全局
        # 禁用非特权 userns，容器内 bwrap 起不来且 apparmor:unconfined 绕不过，
        # 只能在宿主（runner VM）侧放开
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test container health
        run: |
          # 沙箱运行参数与官方 Compose 一致（website/docs/ops/deployment.md）：容器内 bwrap
          # 需要这些权限，缺失时 server 按沙箱红线启动硬失败
          docker run -d --name arcreel-ci \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add NET_ADMIN \
            -e AUTH_USERNAME=ci \
            -e AUTH_PASSWORD=ci-password \
            -e AUTH_TOKEN_SECRET=ci-token-secret \
            -p 1241:1241 arcreel-ci:verify
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:1241/health >/dev/null 2>&1; then
              echo "health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "container failed to become healthy"
          docker logs arcreel-ci
          exit 1

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: arcreel-ci:verify
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  release-integrity:
    # 发布 PR（release-please--* 分支）的完整性校验；其余情形 skip（聚合口径视为通过）。
    # 发布 PR 同时跑全量 CI：它是即将被打 tag 发布的 commit，不因分支名前缀跳过测试。
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Lockfile consistency
        run: uv lock --check

      - name: Version consistency (pyproject / package.json / manifest)
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              py = tomllib.load(f)["project"]["version"]
          with open("frontend/package.json", encoding="utf-8") as f:
              fe = json.load(f)["version"]
          with open(".release-please-manifest.json", encoding="utf-8") as f:
              mf = json.load(f)["."]
          print(f"pyproject={py} package.json={fe} manifest={mf}")
          sys.exit(0 if py == fe == mf else 1)
          EOF

      - name: Changed files whitelist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          allow='^(CHANGELOG\.md|pyproject\.toml|uv\.lock|frontend/package\.json|\.release-please-manifest\.json)$'
          bad=$(echo "$changed" | grep -vE "$allow" || true)
          if [ -n "$bad" ]; then
            echo "发布 PR 含版本产物白名单外的文件，请检查 release-please 配置："
            echo "$bad"
            exit 1
          fi
          echo "发布 PR 变更文件均在白名单内"

  ci-required:
    if: always()
    needs:
      [
        changes,
        backend-static,
        backend-tests,
        postgres-compat,
        frontend-tests,
        docker-verify,
        website-checks,
        release-integrity,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped (domain not affected)"
