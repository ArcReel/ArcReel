name: Nightly Full CI

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      full: true
      coverage: true

  report:
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report Nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full-suite.result }}
        run: python3 scripts/nightly_report.py
