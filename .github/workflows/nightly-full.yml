name: Nightly Full CI

# Daily full tests without path filtering, catching cross-domain regressions missed by domain selection
# (e.g. backend changes breaking image builds or dependency upgrades breaking PG dialect tests).

on:
  schedule:
    - cron: "0 20 * * *" # 04:00 Beijing time
  workflow_dispatch:

# Issue reads/updates in the report job are not concurrently idempotent; serialize the entire workflow.
concurrency:
  group: nightly-full-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      # Pass only secrets declared by the called workflow; explicitly declare new secrets on both sides.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      full: true

  report:
    # Open/update a tracking issue with the ci label on failure; close it automatically after recovery.
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full-suite.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly full CI 失败"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label ci --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ "$RESULT" != "success" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" -R "$GITHUB_REPOSITORY" \
                --body "Nightly 全量 CI 再次失败：$RUN_URL"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label ci \
                --body "Nightly 全量 CI 失败，运行详情：$RUN_URL"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" -R "$GITHUB_REPOSITORY" \
              --comment "Nightly 全量 CI 已恢复：$RUN_URL"
          fi
