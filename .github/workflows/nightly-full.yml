name: Nightly Deep CI

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-exploration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, archives]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          require-checksums: true
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y mediainfo bubblewrap socat
          uv sync --frozen

      - name: Run registered tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 scripts/nightly_invariants.py "$SUITE" 2>&1 | tee nightly-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: nightly-${{ matrix.suite }}-diagnostics
          path: nightly-tests.log
          overwrite: true
          if-no-files-found: warn

  frontend-exploration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run registered tests
        shell: bash
        run: python3 scripts/nightly_invariants.py frontend 2>&1 | tee nightly-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: nightly-frontend-diagnostics
          path: nightly-tests.log
          overwrite: true
          if-no-files-found: warn

  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: |
          pnpm build
          node e2e/build-artifact.ts pack "$RUNNER_TEMP/browser-build"

      - name: Upload shared browser build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/browser-build/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  e2e-live:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: ./.github/actions/restore-browser-build

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          require-checksums: true
          enable-cache: true
          python-version: "3.12"

      - name: Install browser and backend dependencies
        working-directory: frontend
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv sync --frozen

      - name: Run live business flows
        timeout-minutes: 10
        working-directory: frontend
        shell: bash
        env:
          E2E_LIVE: "1"
        run: |
          set -o pipefail
          node node_modules/@playwright/test/cli.js test --project=live 2>&1 | tee "$RUNNER_TEMP/e2e-live.log"

      - name: Upload live diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-diagnostics
          path: |
            ${{ runner.temp }}/e2e-live.log
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  report:
    needs: [backend-exploration, frontend-exploration, browser-build, e2e-live]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          DEEP_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/nightly_report.py
