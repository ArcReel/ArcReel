name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # After release-please changes version in pyproject.toml in a Release PR,
      # uv.lock still references the old version. Check out the release PR branch, run uv lock once, and
      # push the synchronization commit back to that branch, keeping lock and source versions aligned.
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Do not write credentials into worktree .git/config; the single push command below supplies its own remote URL.
          persist-credentials: false

      - name: Set up uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # This job holds a writable token and pushes commits to the release PR branch; restored cache entries would execute
          # with that write permission, so caching is disabled.
          enable-cache: false

      - name: Sync uv.lock
        if: ${{ steps.release.outputs.pr }}
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Without release PR changes, the action emits no pr (an empty string). Step env evaluates before if;
          # direct fromJson would parse that empty string and fail the job. Short-circuit so fromJson runs only with a value.
          PR_BRANCH: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName }}
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with pyproject.toml version"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"
          fi

      # Include the latest catalog-repository data as the release PR’s factory snapshot. Treat this purely as data:
      # execute nothing fetched; use validators already on this release branch. Fetch failures or validation errors
      # only report a warning, leaving the snapshot unchanged and the release PR workflow successful; identical content does not commit.
      - name: Refresh catalog snapshot
        if: ${{ steps.release.outputs.pr }}
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName }}
          CATALOG_BASE_URL: https://raw.githubusercontent.com/ArcReel/arcreel-catalog/main
        run: |
          snapshot=lib/catalog/snapshot
          fetched="$(mktemp -d)"
          # HTTPS only (including redirects), bounded size and duration; size limits match instance official sync (lib/catalog/official_sync.py).
          fetch() { # $1 filename $2 size limit (bytes)
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-filesize "$2" --max-time 30 --retry 2 -o "$fetched/$1" "$CATALOG_BASE_URL/$1"
          }
          if ! fetch manifest.json 65536 || ! fetch catalog.json 8388608; then
            echo "::warning title=目录快照未更新::抓取目录数据失败，出厂快照保持不变"
            exit 0
          fi
          if ! PYTHONPATH=packages/arcreel-catalog-core/src uv run --no-project python -P -m arcreel_catalog_core check "$fetched"; then
            echo "::warning title=目录快照未更新::目录数据未通过校验器，出厂快照保持不变"
            exit 0
          fi
          if cmp -s "$fetched/manifest.json" "$snapshot/manifest.json" && cmp -s "$fetched/catalog.json" "$snapshot/catalog.json"; then
            echo "::notice title=目录快照::出厂快照已是最新"
            exit 0
          fi
          cp "$fetched/manifest.json" "$fetched/catalog.json" "$snapshot/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot"
          git commit -m "chore(catalog): 更新出厂快照"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"
