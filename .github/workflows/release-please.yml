name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release PR 里 pyproject.toml 的 version 被 release-please 改动后，
      # uv.lock 仍指向旧版本。checkout release PR 分支，跑一次 uv lock，把
      # 同步 commit 推回该分支，保持 lock 与 source version 一致。
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # 凭据不写进工作树的 .git/config；推送在下方单条命令里自带远程 URL
          persist-credentials: false

      - name: Set up uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # 本 job 持有可写 token 并向 release PR 分支推送提交，恢复的缓存条目会带着
          # 该写权限执行，故不启用缓存
          enable-cache: false

      - name: Sync uv.lock
        if: ${{ steps.release.outputs.pr }}
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with pyproject.toml version"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"
          fi
