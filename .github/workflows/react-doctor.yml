name: React Doctor

# 非必需检查，直接用 on.paths 裁剪；改为必需检查时须换成 test.yml 的 domain-filter 模式，
# 否则未改前端的 PR 会一直等待该检查
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/**"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/react-doctor.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          directory: frontend
          # CI 不安装依赖，不写 version 会运行 npm 上的 latest；升级 frontend/package.json 的 react-doctor 时同步修改
          version: "0.9.18"
