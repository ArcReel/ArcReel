name: Docker Release

# Formal v* tag releases: dual-architecture vulnerability gate → multi-architecture build → semver + latest tags;
# the same build pushes to ghcr and Docker Hub, with SBOM and provenance attestations.
# release-please creates the GitHub Release; do not generate it again here.
# After image publication succeeds, trigger one build in the catalog data repository (ArcReel/arcreel-catalog).

on:
  push:
    tags: ["v*"]

# Concurrent v* tags let an older version finishing later overwrite mutable latest/{{major}} tags; serialize runs.
# queue: max retains every queued tag; default queue: single keeps only one pending run per group, so pushing several
# tags in succession would discard releases of intermediate versions.
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub namespace matches the GitHub organization; both registries share this lowercase repository name.
      # Forks therefore target their own namespace automatically rather than inheriting upstream push targets.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # Generate APT_REFRESH by ISO week so the Dockerfile system-package layer expires weekly and reruns apt-get upgrade.
      - name: Compute apt refresh key
        id: apt
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The gate builds and scans each architecture: base-image layers and binaries can differ between architectures;
      # scanning only amd64 misses fixable vulnerabilities unique to arm64. Build layers enter the
      # gha cache and are reused directly by the final push step.
      - name: Build amd64 image for release gate scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max,ignore-error=true

      - name: Build arm64 image for release gate scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ github.sha }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max,ignore-error=true

      - name: Trivy release gate amd64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy release gate arm64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy HIGH report amd64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy HIGH report arm64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
            docker.io/${{ env.IMAGE_NAME_LC }}
          # Let metadata-action default flavor (latest=auto) handle latest: only stable
          # semver tags produce it; prerelease tags (e.g. v1.2.3-rc.1) push version tags only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push multi-arch image with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64

      # Both pushes come from the same build, so digests should necessarily match. This step is the sole evidence
      # that synchronization actually occurred; verify every metadata-action tag. Checking only version tags misses
      # latest / {{major}} absent from one registry, and latest is the default pull entry point.
      - name: Assert every pushed tag resolves to the build digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "build digest: ${BUILD_DIGEST}"
          failed=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            if [ "$digest" = "$BUILD_DIGEST" ]; then
              printf '  ok   %s\n' "$tag"
            else
              printf '  FAIL %s -> %s\n' "$tag" "$digest"
              failed=1
            fi
          done <<< "$TAGS"
          if [ "$failed" -ne 0 ]; then
            echo "::error::pushed tags diverge from the build digest"
            exit 1
          fi

      # Once all images are published, trigger the catalog repository build: it releases provider models held back by minimum app versions, based on the latest ArcReel release.
      # Run after image publication to avoid a gap with data available but images unready. Fork releases do not trigger upstream.
      - name: Create App token for catalog build
        id: catalog-token
        if: github.repository == 'ArcReel/ArcReel'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ArcReel
          repositories: arcreel-catalog
          permission-actions: write

      - name: Trigger catalog build
        if: github.repository == 'ArcReel/ArcReel'
        env:
          GH_TOKEN: ${{ steps.catalog-token.outputs.token }}
        run: gh workflow run build.yml -R ArcReel/arcreel-catalog --ref main
