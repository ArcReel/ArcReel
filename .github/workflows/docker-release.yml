name: Docker Release

# v* tag 触发的正式发布：双架构漏洞闸门 → 多架构构建 → semver + latest 标签，
# 同一次构建推送 ghcr 与 Docker Hub，附带 SBOM 与 provenance attestation。
# GitHub Release 由 release-please 创建，此处不再重复生成。

on:
  push:
    tags: ["v*"]

# 不同 v* tag 并发运行时，后完成的旧版本会覆盖 latest/{{major}} 等可变标签，
# 串行执行；queue: max 保留全部排队 tag（默认每组只留一个 pending，
# 连续多个 tag 会丢中间版本的发布）
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: arcreel/arcreel

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 闸门逐架构构建并扫描：架构间基础镜像层与二进制包可能不同，
      # 只扫 amd64 会放过仅存在于 arm64 变体的可修复漏洞。构建层进
      # gha 缓存，最终推送步骤直接复用
      - name: Build amd64 image for release gate scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max,ignore-error=true

      - name: Build arm64 image for release gate scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max,ignore-error=true

      - name: Trivy release gate amd64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy release gate arm64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy HIGH report amd64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy HIGH report arm64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
            ${{ env.DOCKERHUB_IMAGE }}
          # latest 交由 metadata-action 默认 flavor（latest=auto）：仅稳定
          # semver tag 生成，预发布 tag（如 v1.2.3-rc.1）只推版本标签
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push multi-arch image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64

      # 双推是同一次构建的产物，digest 理论上必然相同；这一步是「同步确实发生了」
      # 的唯一凭证，Docker Hub 侧静默失配时立即让发布失败而不是等用户报障
      - name: Assert both registries carry the same digest
        env:
          GHCR_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ghcr_digest=$(docker buildx imagetools inspect "${GHCR_REF}:${VERSION}" --format '{{.Manifest.Digest}}')
          hub_digest=$(docker buildx imagetools inspect "${DOCKERHUB_REF}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "build:      ${BUILD_DIGEST}"
          echo "ghcr:       ${ghcr_digest}"
          echo "docker hub: ${hub_digest}"
          if [ "$ghcr_digest" != "$BUILD_DIGEST" ] || [ "$hub_digest" != "$BUILD_DIGEST" ]; then
            echo "::error::registry digests diverge from the build output"
            exit 1
          fi
