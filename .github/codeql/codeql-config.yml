name: "ArcReel CodeQL Config"

paths-ignore:
  - alembic/versions

# AlertSuppression is outside the default suite: without it, inline `# codeql[rule-id]` suppressions are not written to
# SARIF suppressions[]; false positives require GitHub API dismissal (alert numbers also drift with line numbers).
# The javascript language key covers JS/TS; packs do not affect the default query suite, which still runs.
packs:
  python:
    - codeql/python-queries:AlertSuppression.ql
  javascript:
    - codeql/javascript-queries:AlertSuppression.ql
