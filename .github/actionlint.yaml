# actionlint exemptions. It has no inline suppression syntax; the only exemption form lists error-message regexes
# per file here, each with a reason.
paths:
  .github/workflows/docker-release.yml:
    ignore:
      # concurrency.queue is officially supported by GitHub (queue: single is the default; queue: max retains
      # up to 100 pending runs), but actionlint 1.7.12 syntax-check does not recognize it yet.
      - 'unexpected key "queue" for "concurrency" section'
