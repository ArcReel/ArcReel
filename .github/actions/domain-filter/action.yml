name: domain-filter
description: >-
  按变更域裁剪 CI：输出 backend / frontend / docker / website 四个域是否被本次
  变更命中。workflow 域（CI 配置本身）变更时保守全量触发；full 输入为 true 时
  跳过路径过滤，所有域视为已变更（供 nightly 全量与 schedule 事件使用——
  paths-filter 不支持 schedule 事件的变更比对）。

inputs:
  full:
    description: 为 true 时跳过路径过滤，所有域视为已变更
    required: false
    default: "false"

outputs:
  backend:
    description: 后端域（server/lib/tests/alembic/依赖文件/agent_runtime_profile）是否变更
    value: ${{ steps.gate.outputs.backend }}
  frontend:
    description: 前端域（frontend/）是否变更
    value: ${{ steps.gate.outputs.frontend }}
  docker:
    description: 镜像装配域（Dockerfile/.dockerignore 及不属于代码域的 COPY 源）是否变更
    value: ${{ steps.gate.outputs.docker }}
  website:
    description: 文档站域（website/ 及上站 README/CONTRIBUTING）是否变更
    value: ${{ steps.gate.outputs.website }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      if: inputs.full != 'true'
      id: filter
      with:
        filters: |
          # .github/** 覆盖 workflows/actions/codeql 配置等全部 CI 基础设施；
          # .codecov.yml 决定覆盖率状态与 flag 行为；.gitignore 影响 ruff 的
          # 文件发现（respect-gitignore 对已跟踪文件同样生效）
          workflow:
            - '.github/**'
            - '.codecov.yml'
            - '.gitignore'
          backend:
            - 'server/**'
            - 'lib/**'
            - 'tests/**'
            - 'alembic/**'
            - 'alembic.ini'
            - 'scripts/**'
            - 'agent_runtime_profile/**'
            - 'pyproject.toml'
            - 'uv.lock'
          frontend:
            - 'frontend/**'
          # public/ 目录与根目录 README.md 是 Dockerfile 的 COPY 源且不属于
          # backend/frontend 域，单独变更时需经 docker-verify 验证镜像装配
          docker:
            - 'Dockerfile'
            - '.dockerignore'
            - 'public/**'
            - 'README.md'
          # CONTRIBUTING.md/README.md/README.en.md 不上站，但在翻译 lockfile 的特例映射内
          # （见 .claude/skills/translate-docs/），改动须当场冒出缺译/滞后报告
          website:
            - 'website/**'
            - 'CONTRIBUTING.md'
            - 'README.md'
            - 'README.en.md'

    - id: gate
      shell: bash
      env:
        FULL: ${{ inputs.full }}
        # full 模式跳过 filter 步骤时其 outputs 为空，在表达式层统一兜底
        F_WORKFLOW: ${{ steps.filter.outputs.workflow || 'false' }}
        F_BACKEND: ${{ steps.filter.outputs.backend || 'false' }}
        F_FRONTEND: ${{ steps.filter.outputs.frontend || 'false' }}
        F_DOCKER: ${{ steps.filter.outputs.docker || 'false' }}
        F_WEBSITE: ${{ steps.filter.outputs.website || 'false' }}
      run: |
        if [[ "$FULL" == "true" || "$F_WORKFLOW" == "true" ]]; then
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "website=true" >> "$GITHUB_OUTPUT"
        else
          echo "backend=$F_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$F_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "docker=$F_DOCKER" >> "$GITHUB_OUTPUT"
          echo "website=$F_WEBSITE" >> "$GITHUB_OUTPUT"
        fi
