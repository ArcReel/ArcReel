name: domain-filter
description: >-
  按变更域裁剪 CI：输出 workflow / backend / frontend / docker / website 五个域是否
  被本次变更命中。workflow 域（CI 配置本身）变更时另外四个域保守全量触发；full 输入
  为 true 时跳过路径过滤，所有域视为已变更（供 nightly 全量与 schedule 事件使用——
  paths-filter 不支持 schedule 事件的变更比对）。

inputs:
  full:
    description: 为 true 时跳过路径过滤，所有域视为已变更
    required: false
    default: "false"

outputs:
  workflow:
    description: CI 配置域（.github/、.codecov.yml、.gitignore）是否变更
    value: ${{ steps.gate.outputs.workflow }}
  backend:
    description: 后端域（server/lib/tests/alembic/workspace 子包/依赖文件/agent_runtime_profile）是否变更
    value: ${{ steps.gate.outputs.backend }}
  frontend:
    description: 前端域（frontend/）是否变更
    value: ${{ steps.gate.outputs.frontend }}
  docker:
    description: 镜像装配域（Dockerfile/.dockerignore 及不属于代码域的 COPY 源）是否变更
    value: ${{ steps.gate.outputs.docker }}
  website:
    description: 文档站域（website/、CONTRIBUTING.md、两个 README 及翻译 skill）是否变更
    value: ${{ steps.gate.outputs.website }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      if: inputs.full != 'true'
      id: filter
      with:
        filters: |
          # .github/** covers all CI infrastructure, including workflows/actions/codeql configuration;
          # .codecov.yml controls coverage statuses and flags; .gitignore affects ruff file
          # discovery (respect-gitignore also applies to tracked files).
          workflow:
            - '.github/**'
            - '.codecov.yml'
            - '.gitignore'
          backend:
            - 'server/**'
            - 'lib/**'
            - 'tests/**'
            - 'alembic/**'
            - 'alembic.ini'
            - 'scripts/**'
            - 'agent_runtime_profile/**'
            - 'packages/**'
            - 'pyproject.toml'
            - 'uv.lock'
            # Backend contract tests read these frontend source files directly; they also match the frontend domain.
            - 'frontend/src/i18n/*/dashboard.ts'
            - 'frontend/src/i18n/*/events.ts'
            - 'frontend/src/types/workflow.ts'
            - 'frontend/src/data/example-templates/**'
            - 'frontend/src/test/contracts/**'
          frontend:
            - 'frontend/**'
          # public/ and root README.md are Dockerfile COPY sources outside the
          # backend/frontend domains; isolated changes require docker-verify image-assembly validation.
          docker:
            - 'Dockerfile'
            - '.dockerignore'
            - 'public/**'
            - 'README.md'
          # CONTRIBUTING.md is copied onto the site during builds; neither README is published there, but both have
          # special translation-lockfile mappings, so changes must immediately produce missing/stale reports. Include the translate-docs skill too:
          # website-checks orphan-translation detection, stale reports, and the skill unit tests all execute its
          # translation-lock.mjs; those checks must still run when only that script changes.
          website:
            - 'website/**'
            - 'CONTRIBUTING.md'
            - 'README.md'
            - 'README.en.md'
            - '.claude/skills/translate-docs/**'

    - id: gate
      shell: bash
      env:
        FULL: ${{ inputs.full }}
        # When full mode skips filter, its outputs are empty; apply the fallback consistently in expressions.
        F_WORKFLOW: ${{ steps.filter.outputs.workflow || 'false' }}
        F_BACKEND: ${{ steps.filter.outputs.backend || 'false' }}
        F_FRONTEND: ${{ steps.filter.outputs.frontend || 'false' }}
        F_DOCKER: ${{ steps.filter.outputs.docker || 'false' }}
        F_WEBSITE: ${{ steps.filter.outputs.website || 'false' }}
      run: |
        if [[ "$FULL" == "true" ]]; then
          echo "workflow=true" >> "$GITHUB_OUTPUT"
        else
          echo "workflow=$F_WORKFLOW" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$FULL" == "true" || "$F_WORKFLOW" == "true" ]]; then
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "website=true" >> "$GITHUB_OUTPUT"
        else
          echo "backend=$F_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$F_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "docker=$F_DOCKER" >> "$GITHUB_OUTPUT"
          echo "website=$F_WEBSITE" >> "$GITHUB_OUTPUT"
        fi
