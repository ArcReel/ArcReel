# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies via uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    # Let newly released versions settle for a few days before opening PRs to reduce immediate-release regressions;
    # semver-minor uses default-days; only tiers differing from it are listed separately.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "chore(deps)"
    # pydantic pins the exact pydantic-core version; pydantic-core must upgrade together with pydantic.
    # Upgrading pydantic-core alone pulls in its matching prerelease pydantic. Ignore version updates only:
    # ignore without update-types would also suppress security updates.
    ignore:
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # Domain groups accept minor/patch only, combining them into PRs safe for automatic merging;
    # major matches no group and gets a separate PR for human review.
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "pydantic*"
          - "python-multipart"
          - "python-dotenv"
        update-types:
          - "minor"
          - "patch"
      database:
        patterns:
          - "sqlalchemy*"
          - "aiosqlite"
          - "asyncpg"
          - "alembic"
        update-types:
          - "minor"
          - "patch"
      ai-sdks:
        patterns:
          - "anthropic"
          - "claude-agent-sdk"
          - "grpcio"
          - "mcp"
          - "google-genai"
          - "openai"
          - "volcengine-python-sdk*"
          - "tos"
          - "xai-sdk"
          - "instructor"
        update-types:
          - "minor"
          - "patch"
      auth:
        patterns:
          - "pyjwt"
          - "pwdlib*"
        update-types:
          - "minor"
          - "patch"
      media:
        patterns:
          - "Pillow"
          - "numpy"
          - "pyjianyingdraft"
          - "imageio-ffmpeg"
        update-types:
          - "minor"
          - "patch"
      document-parsing:
        patterns:
          - "pdf-oxide"
          - "mammoth"
          - "docx2txt"
          - "beautifulsoup4"
          - "lxml"
          - "charset-normalizer"
        update-types:
          - "minor"
          - "patch"
      backend-core:
        patterns:
          - "Jinja2"
          - "PyYAML"
          - "httpx"
          - "jsonpath-rfc9535"
          - "jsonschema"
          - "packaging"
          - "portalocker"
          - "socksio"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "anyio"
          - "pytest*"
          - "ruff"
          - "basedpyright"
          - "deptry"
          - "pre-commit"
          - "python-docx"
          - "import-linter"
          - "respx"
          - "mutmut"
          - "blockbuster"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Upgrades within the ^ range change only the lockfile; only out-of-range (major) upgrades change package.json and open a PR.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    # jsdom is capped at 30.0.x: vitest 4 reads the internal field when converting a jsdom Blob into a Node Blob
    # `_buffer`; jsdom 30.1 renamed it, breaking URL.createObjectURL / FormData tests that pass File.
    # Unlock when frontend upgrades to vitest >= 5.0.3 (which reads the new field).
    # @types/node follows the Node major in package.json engines (24); adjust the major manually with Node upgrades.
    ignore:
      - dependency-name: "jsdom"
        versions: [">=30.1"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
        update-types:
          - "minor"
          - "patch"
      ui-libs:
        patterns:
          - "lucide-react"
          - "@lobehub/*"
          - "@dnd-kit/*"
          - "cmdk"
          - "recharts"
          - "react-resizable-panels"
          - "streamdown"
          - "driver.js"
          - "@fontsource/*"
          - "@fontsource-variable/*"
        update-types:
          - "minor"
          - "patch"
      # shadcn primitive runtime and CLI. Major versions get separate PRs outside the group: in that PR, run
      # `pnpm exec shadcn add <组件> --diff` on installed components and merge manually (see docs/agents/dependencies.md).
      shadcn-stack:
        patterns:
          - "@base-ui/react"
          - "@shadcn/react"
          - "shadcn"
          - "cn"
          - "class-variance-authority"
          - "tw-animate-css"
        update-types:
          - "minor"
          - "patch"
      vite-tailwind:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      # When upgrading @playwright/test, align the frontend-e2e image version in .github/workflows/test.yml in the same PR,
      # or CI cannot find the browsers.
      e2e:
        patterns:
          - "@playwright/test"
          - "@axe-core/*"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"
      eslint-stack:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
          - "@shadcn/lint"
        update-types:
          - "minor"
          - "patch"
      app-core:
        patterns:
          - "wouter"
          - "zustand"
          - "eventsource-parser"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Documentation-site npm dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    # website typescript is capped at 6.x: website/tsconfig.json extends @docusaurus/tsconfig,
    # which sets baseUrl in compilerOptions. TypeScript 6 deprecated that option
    # (tsconfig.json explicitly exempts it with ignoreDeprecations: "6.0"); TypeScript 7 removed it,
    # causing TS5102 on load with no exemption. Unlock when @docusaurus/tsconfig removes baseUrl.
    # This constraint applies only to website/; assess frontend/ TypeScript upgrades independently.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/docusaurus-search-local"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # The github-actions ecosystem supports default-days only, without semver-specific cooldown fields.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
