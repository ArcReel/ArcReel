services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: arcreel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: arcreel
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcreel"]
      interval: 10s
      timeout: 5s
      retries: 5

  arcreel:
    image: arcreel/arcreel:latest
    ports:
      - "1241:1241"
    # Published on all host interfaces: remote deployments must not set AUTH_ENABLED=false in .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://arcreel:${POSTGRES_PASSWORD}@postgres:5432/arcreel
      TZ: ${TZ:-Asia/Shanghai}
    # Agent Bash sandbox (bwrap) requires:
    # 1) Unprivileged user namespaces: relax Docker default seccomp/apparmor profiles.
    # 2) Loopback setup in bwrap’s nested network namespace: NET_ADMIN capability
    #    (otherwise "loopback: Failed RTM_NEWADDR: Operation not permitted")
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.env:/app/.env
      - ./projects:/app/projects
      - ./claude_data:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1241/health"]
      interval: 30s
      timeout: 5s
      retries: 3
