# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repository YAML normally replaces web configuration entirely; inheritance retains web settings for options omitted here.
inheritance: true
knowledge_base:
  code_guidelines:
    # Domain standards under docs/standards/ apply to source paths declared in frontmatter paths.
    # Between standards:start and standards:end, `uv run python scripts/audit_conventions.py --fix` generates entries; never edit them manually.
    filePatterns:
      # standards:start
      - files: "docs/standards/backend.md"
        applyTo: "lib/**,server/**,scripts/**,alembic/**,packages/**"
      - files: "docs/standards/copy.md"
        applyTo: "frontend/src/i18n/zh/**,lib/i18n/zh/**,website/docs/**,README.md,CONTRIBUTING.md,docs/**,**/CLAUDE.md"
      - files: "docs/standards/docs.md"
        applyTo: "website/docs/**,README.md,README.en.md,CONTRIBUTING.md"
      - files: "docs/standards/frontend.md"
        applyTo: "frontend/src/**"
      - files: "docs/standards/general.md"
        applyTo: "**"
      - files: "docs/standards/providers.md"
        applyTo: "lib/backends/**,lib/custom_provider/**,lib/config/**,lib/billing/**,lib/agent/agent_provider_catalog.py,lib/prompts/prompt_builders*.py,agent_runtime_profile/**,docs/api-docs/**"
      - files: "docs/standards/testing.md"
        applyTo: "tests/**,packages/*/tests/**,frontend/src/**/*.test.*,frontend/src/test/**,frontend/src/__mocks__/**,frontend/e2e/**"
      # standards:end
