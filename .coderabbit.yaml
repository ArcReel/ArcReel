# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 仓库 YAML 默认整体替换网页端配置；inheritance 让这里没写的配置项继续沿用网页端设置。
inheritance: true
knowledge_base:
  code_guidelines:
    filePatterns:
      # standards:start
      - files: "docs/standards/backend.md"
        applyTo: "lib/**,server/**,scripts/**,alembic/**,packages/**"
      - files: "docs/standards/copy.md"
        applyTo: "frontend/src/i18n/zh/**,lib/i18n/zh/**,website/docs/**,README.md,CONTRIBUTING.md,docs/**,AGENTS.md,GLOSSARY.md,**/CLAUDE.md,.claude/rules/**,.agents/skills/**/*.md,agent_runtime_profile/**/*.md"
      - files: "docs/standards/docs.md"
        applyTo: "website/docs/**,website/i18n/*/docusaurus-plugin-content-docs/current/**,README.md,README.en.md,CONTRIBUTING.md"
      - files: "docs/standards/frontend.md"
        applyTo: "frontend/src/**"
      - files: "docs/standards/general.md"
        applyTo: "**"
      - files: "docs/standards/providers.md"
        applyTo: "lib/backends/**,lib/custom_provider/**,lib/config/**,lib/billing/**,lib/agent/agent_provider_catalog.py,lib/prompts/prompt_builders*.py,agent_runtime_profile/**,docs/api-docs/**"
      - files: "docs/standards/testing.md"
        applyTo: "tests/**,packages/*/tests/**,frontend/src/**/*.test.*,frontend/src/test/**,frontend/src/__mocks__/**,frontend/e2e/**,frontend/playwright.config.ts,frontend/vitest.config.ts,scripts/e2e_record_backend.py"
      # standards:end
