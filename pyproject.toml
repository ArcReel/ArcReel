[project]
name = "arcreel"
# managed by release-please — do not bump manually
version = "0.28.0"
description = "AI video generation workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.76",
    "fastapi>=0.138.2",
    # fastapi 未 re-export 的 ASGI 类型与 MutableHeaders / FormData / UploadFile 直接取自 starlette。
    "starlette>=1.6.0",
    "google-genai>=1.65.0",
    "Pillow>=12.1.1",
    "pydantic>=2.12.5",
    # pydantic 未 re-export 的 ErrorDetails / PydanticCustomError 直接取自 pydantic-core。
    "pydantic-core>=2.46.4",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pwdlib[argon2]>=0.3.0",
    "volcengine-python-sdk[ark]>=5.0.17",
    "openai>=2.30.0",
    "xai-sdk>=1.8.2",
    "pyjianyingdraft>=0.2.6,<0.3",
    "instructor>=1.14.5",
    "charset-normalizer>=3.4.6",
    "docx2txt>=0.9",
    "mammoth>=1.12.0",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "packaging>=24.0",
    "portalocker>=2.10.1",
    "pdf-oxide>=0.3.46",
    "socksio>=1.0.0",
    "mcp>=1.29.0,<2",
    "jsonschema>=4.26.0",
    "jsonpath-rfc9535>=1.0.0",
    "httpx>=0.28.1",
    "grpcio>=1.83.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "pre-commit>=4.0.0",
    "python-docx>=1.2.0",
    "basedpyright>=1.39.4",
    "import-linter>=2.13",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
    "deptry>=0.24.0",
]
# 变异测试工具，不进 dev：只在按批次跑 mutmut 时 `uv sync --group mutation` 装入。
# 独立成组是为了让版本 pin 进 uv.lock、被 dependabot 看到；流程见 docs/testing/mutmut-runbook.md。
mutation = [
    "mutmut==3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --durations=25"
asyncio_mode = "auto"
# 卡死保护，不是耗时预算：当前最慢用例 30s，留 4 倍余量。个别用例需要更大预算时用
# `@pytest.mark.timeout(N)` 单独放宽，不抬全局值。
timeout = 120
# signal 法对 async 与 sync 用例均生效，超时表现为普通 failure（会话继续、teardown
# 正常、可归因）；thread 法以 os._exit 硬杀进程，xdist 下等价于 worker crash。
timeout_method = "signal"
# 并行不写进 addopts，只在 CI 命令里显式开（-n 4 --dist loadfile）：小选集并行更慢，
# 每 worker 重新 import server.app 的固定开销吃掉全部收益，而本地调试几乎都是小选集。
markers = [
    "unit: 快速、隔离、不触达真实 I/O 或外部服务的测试",
    "integration: 跨模块真实协作测试；禁止 mock 被测 module 的公共入口（否则是在测 mock 本身）",
    "e2e: 端到端、依赖真实外部资源（远程 API、大模型调用、重型 ffmpeg 等）的测试；CI 默认跳过",
    "sqlite_only: 仅适用于 SQLite 的测试（依赖 SQLite 特定 fixture / 行为，PG CI job 会跳过）",
    "uses_db: 触达真实数据库的测试（repo/DAO/ORM/迁移）；PG job 用 `-m uses_db` 选集合。由 conftest 根据 fixture 使用自动注入",
]

[tool.coverage.run]
source = ["lib", "server"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    'if __name__ == "__main__":',
    "if __name__ == '__main__':",
]

[tool.importlinter]
root_packages = ["lib"]

# lib.config < lib.*_backends < lib.custom_provider：config 是配置解析的基础层，backends
# 在其上组装出各供应商实现，custom_provider 再在 backends 之上拼装自定义供应商。四个 backend
# 包为同层 sibling（`:` 分隔），彼此复用 video_backends.base 的工具不算方向违规。
# ignore_imports 是存量违规的 baseline，逐条掐的是**违规链的终端边**而非首跳，这样中间模块
# （project_manager / cost_calculator / usage_repo 等）后续新增的反向依赖仍会被契约拦下。
# 新增条目前先确认该边无法就地清零；清零一条即删一行。
[[tool.importlinter.contracts]]
name = "lib.config / lib.*_backends / lib.custom_provider 分层契约"
type = "layers"
layers = [
    "custom_provider",
    "image_backends : video_backends : audio_backends : text_backends",
    "config",
]
containers = ["lib"]
ignore_imports = [
    # lib.config.resolver 直接向上引用自定义供应商装配层（函数体内延迟导入，静态分析仍计入）
    "lib.config.resolver -> lib.custom_provider",
    "lib.config.resolver -> lib.custom_provider.capabilities",
    "lib.config.resolver -> lib.custom_provider.endpoint_resolution",
    # lib.config.resolver 直接向上引用 backend 层
    "lib.config.resolver -> lib.text_backends.base",
    # 中间模块把 backend 层拉回 config 之下的可达范围
    "lib.backend_assembly.specs -> lib.audio_backends.registry",
    "lib.backend_assembly.specs -> lib.image_backends.registry",
    "lib.backend_assembly.specs -> lib.video_backends.registry",
    "lib.backend_assembly.specs -> lib.video_backends.base",
    "lib.backend_assembly.specs -> lib.text_backends.registry",
    # 声明式内置端点的装配接缝（ADR 0039）：spec 行按 registry_backend="declarative" 从
    # 随版定义读能力与构造 backend，spec 表因此同时够到 backend 层与 custom_provider 层。
    "lib.backend_assembly.specs -> lib.custom_provider.builtin_definitions",
    "lib.backend_assembly.specs -> lib.custom_provider.declarative_backend",
    "lib.backend_assembly.specs -> lib.custom_provider.endpoints",
    "lib.project_manager -> lib.text_backends.base",
    "lib.text_generator -> lib.text_backends.base",
    "lib.text_generator -> lib.text_backends.factory",
    # 中间模块反向引用 custom_provider（provider_id 解析与自定义供应商记账）
    "lib.backend_assembly.assembler -> lib.custom_provider",
    "lib.backend_assembly.assembler -> lib.custom_provider.loader",
    "lib.cost_calculator -> lib.custom_provider",
    "lib.db.repositories.usage_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider.endpoints",
    "lib.db.models.custom_provider -> lib.custom_provider",
]

# 路线中立层不得依赖某一条具体路线的子包。违约条目类型（draft_violation）、草稿信封
# （draft_quarantine）、正式 script_plan 的路径与写禁表（episode_paths）对 drama / narration /
# reference_video 一视同仁，任一处 import lib.reference_video 都是把三条路线共用的机制绑在
# 其中一条上。
# lib.script_review 不在列：它另有一条 lib.reference_video.duration_migration 的依赖（参考
# 生视频专属的时长收编），纳入就要加 baseline 掩盖，那等于让契约声明一件它此刻并不成立的事。
[[tool.importlinter.contracts]]
name = "路线中立层不依赖参考生视频子包"
type = "forbidden"
source_modules = [
    "lib.draft_violation",
    "lib.draft_quarantine",
    "lib.episode_paths",
]
forbidden_modules = ["lib.reference_video"]

[tool.deptry]
# 扫描范围与 basedpyright 的 include 对齐：核心库、服务端、迁移基础设施、脚本与测试。
# exclude 是 deptry 默认值去掉 tests（测试的 import 也要参与依赖卫生判定）再补上 worktree 目录。
exclude = ["venv", "\\.venv", "\\.direnv", "\\.git", "setup\\.py", "\\.worktrees", "\\.claude/worktrees"]
known_first_party = ["lib", "server", "alembic", "scripts", "tests"]

[tool.deptry.per_rule_ignores]
# DEP002（声明了但无 import）——全部是靠 entry point / 后端注册被运行时加载的插件，
# 源码里不会出现 import。
DEP002 = [
    "aiosqlite",        # SQLAlchemy 的 sqlite+aiosqlite 异步驱动
    "asyncpg",          # SQLAlchemy 的 postgresql+asyncpg 异步驱动
    "python-multipart", # Starlette 解析 multipart/form-data 的后端
    "socksio",          # httpx 的 SOCKS 代理传输后端
    "lxml",             # BeautifulSoup 的 lxml / lxml-xml 解析器后端
    "mutmut",           # 变异测试 CLI，源码不 import 它；变异后的模块只在 mutants/ 副本里 import
]
# DEP004（import 了 dev 依赖）——tests/ 与 scripts/ 在扫描范围内，deptry 无法按目录区分
# dev 与生产文件，故逐项列出它们正当 import 的测试框架包；其余 dev 依赖仍受本规则守护。
DEP004 = [
    "pytest",         # 测试框架
    "pytest_asyncio", # pytest 的 asyncio 插件，测试内直接用 @pytest_asyncio.fixture（本规则按模块名匹配）
    "respx",          # httpx 的测试替身
]

[tool.ruff]
line-length = 120
exclude = [".worktrees", ".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PT", "RET", "PERF", "RUF", "SIM", "ASYNC"]
# RUF001-003：中文注释与文案里的全角标点被判为「易混淆 unicode」，对中文仓库是纯噪音。
ignore = ["E402", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入以「参数默认值处调用」为惯用法，B008 对其属误报；登记后无需逐处 noqa。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.basedpyright]
include = ["lib", "server", "alembic", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".worktrees",
    ".claude/worktrees",
    "frontend",
    "projects",
    "agent_runtime_profile",
    "vertex_keys",
    "build",
    "dist",
    "alembic/versions",
]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
pythonPlatform = "All"

typeCheckingMode = "standard"

reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportImportCycles = false
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnreachable = "warning"
reportDeprecated = "warning"

reportGeneralTypeIssues = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportTypedDictNotRequiredAccess = "error"
reportPrivateImportUsage = "error"
reportInvalidTypeForm = "error"
reportInvalidTypeArguments = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
# 以下规则在测试域不做闸门：测试里 repo/manager 调用通常断言式访问，narrow 噪声大；
# mock 返回也常被 subscript。闸门跑 `basedpyright --warnings` 后 warning 即阻断，
# 故这批降级写成 none 才是「测试域不做闸门」这一既有决策的诚实表达。
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"

[[tool.basedpyright.executionEnvironments]]
root = "alembic"
# alembic 模板里的 `from alembic import context` 等运行期注入符号静态不可解析，此域不做闸门
reportMissingImports = "none"

# scripts/ 是一次性辅助脚本（迁移、生成 fixture、烟雾测试），
# 不值得花大力气做类型，但 tests/scripts/ 会 import 它们，所以必须可解析
[[tool.basedpyright.executionEnvironments]]
root = "scripts"
reportArgumentType = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalCall = "none"
reportOptionalOperand = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportAttributeAccessIssue = "none"
reportPossiblyUnboundVariable = "none"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
# 脚本用 sys.path 注入后再 import，静态不可解析，此域不做闸门
reportMissingImports = "none"

# 变异测试（mutmut 3.7.0）。不进 dev 依赖，按需 `uv run --with mutmut==3.7.0 mutmut run`。
# 变异得分是信号不是闸门：不为杀死变异体补写测试，只用存活 mutant 筛选待审查的测试。
[tool.mutmut]
# 操作流程（跑一批、超时复核、三层验收、已知陷阱）见 docs/testing/mutmut-runbook.md；这里只写配置项的取舍。
# 必须显式写：不写时 mutmut 只推断出 lib/，漏掉 server/
source_paths = ["lib", "server"]
# 按批次填写待变异模块；留空则变异 source_paths 全域（一轮数小时，不实用）
# only_mutate = ["lib/speech_rate.py"]
# 变异后的模块 import mutmut.__main__，而该 import 在模块级就按 CWD 解析 [tool.mutmut]；
# tests/unit/test_skill_script_path_guards.py 的用例一律在项目外的 tmp 目录启子进程跑 skill 脚本，
# 子进程 CWD 无 pyproject.toml 即崩在 _guess_source_paths()，故整体排除。
# 这些子进程确实会 import lib.project_manager / lib.script_models，排除后由它们独家覆盖的
# mutant 会掉进存活集合；但保留同样杀不死——子进程在断言前就崩在上面那个 import。
# 排除只把这类 mutant 推向假存活（多复核一个），不会造成假杀死（把无效测试藏起来）。
pytest_add_cli_args = ["--ignore=tests/unit/test_skill_script_path_guards.py"]
# pytest_add_cli_args_test_selection 不设：走全量 testpaths。仅 tests/unit 快 5.5 倍，
# 但存活集合约 45% 是假存活，复核每个都要跑一次全量套件，总账反而更贵。
# timeout_multiplier / timeout_constant 保持默认（15 / 1.0），不要调小。
# 预算按关联用例的运行时长外推，调小只会把慢用例上的真存活记成 killed（假杀死），把无效测试藏起来。
also_copy = [
    "agent_runtime_profile",
    "alembic",
    "alembic.ini",
    "scripts",
    "skills",
    "skills-lock.json",
    "public",
    ".github",
    "frontend/src",
]
