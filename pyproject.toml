[project]
name = "arcreel"
# managed by release-please — do not bump manually
version = "0.37.0"
description = "AI video generation workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.177",
    "fastapi>=0.138.2",
    "starlette>=1.8.0",
    "google-genai>=2.21.0",
    "Pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-core>=2.46.4",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pwdlib[argon2]>=0.3.0",
    "volcengine-python-sdk[ark]>=5.0.17",
    "openai>=2.30.0",
    "xai-sdk>=1.20.0",
    "pyjianyingdraft>=0.3.0",
    "instructor>=1.16.0",
    "charset-normalizer>=3.4.6",
    "docx2txt>=0.9",
    "mammoth>=1.12.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "packaging>=24.0",
    "portalocker>=2.10.1",
    "pdf-oxide>=0.3.46",
    "socksio>=1.0.0",
    "mcp>=1.29.0,<2",
    "jsonschema>=4.26.0",
    "httpx>=0.28.1",
    "grpcio>=1.83.0",
    "numpy>=2.5.2",
    "jinja2>=3.1.6",
    "arcreel-market-core",
    "arcreel-catalog-core",
    "imageio-ffmpeg>=0.6.0",
    "anthropic>=0.125.0,<1",
    "tos>=2.9.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "pre-commit>=4.0.0",
    "python-docx>=1.2.0",
    "basedpyright>=1.39.4",
    "import-linter>=2.13",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
    "deptry>=0.24.0",
    "pytest-testmon>=2.2.0",
    "blockbuster>=1.5.29",
    "anyio>=4.14.2",
    "time-machine>=3.6.0",
    "tree-sitter-language-pack==0.13.0",
    "tree-sitter>=0.25,<0.27",
]
mutation = [
    "mutmut==3.7.0",
]

[tool.uv.workspace]
members = ["packages/arcreel-market-core", "packages/arcreel-catalog-core"]

[tool.uv.sources]
arcreel-market-core = { workspace = true }
arcreel-catalog-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --durations=25"
asyncio_mode = "auto"
timeout = 120
# signal 法对 async 与 sync 用例均生效，超时表现为普通 failure（会话继续、teardown
# 正常、可归因）；thread 法以 os._exit 硬杀进程，xdist 下等价于 worker crash。
timeout_method = "signal"
markers = [
    "unit: 快速、隔离的测试；可只读访问仓库内已提交的文件，写文件只落在 tmp_path，不触达真实 DB、子进程、网络或外部服务",
    "integration: 跨模块真实协作测试；禁止 mock 被测 module 的公共入口（否则是在测 mock 本身）",
    "e2e: 端到端、依赖真实外部资源（远程 API、大模型调用、重型 ffmpeg 等）的测试；CI 默认跳过",
    "sqlite_only: 仅适用于 SQLite 的测试（依赖 SQLite 特定 fixture / 行为，PG CI job 会跳过）",
    "uses_db: 触达真实数据库的测试（repo/DAO/ORM/迁移）；PG job 用 `-m uses_db` 选集合。由 conftest 根据 fixture 使用自动注入",
    "local_port: 绑定 127.0.0.1 端口的测试；在禁止绑定本地端口的环境（如 Agent 沙箱）中由 conftest 跳过并给出原因",
]

[tool.coverage.run]
source = ["lib", "server", "arcreel_market_core", "arcreel_catalog_core"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    'if __name__ == "__main__":',
    "if __name__ == '__main__':",
]

[tool.importlinter]
root_packages = ["lib", "server", "arcreel_market_core", "arcreel_catalog_core"]
include_external_packages = true

# ignore_imports 是存量违规的 baseline，逐条掐的是**违规链的终端边**而非首跳，这样中间模块
# （project_manager / usage_repo 等）后续新增的反向依赖仍会被契约拦下。
# 新增条目前先确认该边无法就地清零；清零一条即删一行。
[[tool.importlinter.contracts]]
name = "lib.config / lib.backends.*_backends / lib.custom_provider / lib.market 分层契约"
type = "layers"
layers = [
    "market",
    "custom_provider",
    "backends.image_backends : backends.video_backends : backends.audio_backends : backends.text_backends",
    "config",
]
containers = ["lib"]
ignore_imports = [
    "lib.config.resolver -> lib.custom_provider",
    "lib.config.resolver -> lib.custom_provider.capabilities",
    "lib.config.resolver -> lib.custom_provider.default_models",
    "lib.config.resolver -> lib.custom_provider.endpoint_resolution",
    "lib.config.resolver -> lib.custom_provider.model_facts",
    "lib.config.resolver -> lib.backends.text_backends.base",
    "lib.backends.backend_assembly.specs -> lib.backends.audio_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.image_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.video_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.text_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.builtin_definitions",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.declarative_backend",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.endpoints",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.capabilities",
    "lib.project.project_manager -> lib.backends.text_backends.base",
    "lib.backends.text_generator -> lib.backends.text_backends.base",
    "lib.backends.text_generator -> lib.backends.text_backends.factory",
    "lib.backends.backend_assembly.assembler -> lib.custom_provider",
    "lib.backends.backend_assembly.assembler -> lib.custom_provider.loader",
    "lib.billing.multipliers -> lib.custom_provider",
    "lib.billing.multipliers -> lib.custom_provider.discovery_formats",
    "lib.db.repositories.usage_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider.endpoints",
    "lib.db.models.custom_provider -> lib.custom_provider",
]

[[tool.importlinter.contracts]]
name = "ComfyUI 端点实现不依赖声明式运行时"
type = "forbidden"
source_modules = ["lib.custom_provider.comfyui", "arcreel_market_core.comfyui"]
forbidden_modules = [
    "lib.custom_provider.declarative_backend",
    "arcreel_market_core.endpoint_definition.validator",
    "arcreel_market_core.endpoint_definition.template_engine",
    "arcreel_market_core.endpoint_definition.response_extractor",
    "arcreel_market_core.endpoint_definition.jsonpath_subset",
]

[[tool.importlinter.contracts]]
name = "arcreel_market_core 不依赖主仓"
type = "forbidden"
source_modules = ["arcreel_market_core"]
forbidden_modules = ["lib", "server"]

[[tool.importlinter.contracts]]
name = "arcreel_catalog_core 不依赖主仓"
type = "forbidden"
source_modules = ["arcreel_catalog_core"]
forbidden_modules = ["lib", "server", "arcreel_market_core"]

# lib.script.script_review 不在列：它另有一条 lib.script.reference_video.duration_migration 的依赖（参考
# 生视频专属的时长收编），纳入就要加 baseline 掩盖，那等于让契约声明一件它此刻并不成立的事。
# lib.script.script_references 同理不在列：它按设计依赖 lib.script.reference_video.text_parser——「引用名落在
# 载荷哪些位置」里有一类是正文的 @[名称] 记号，识别它的解析器只此一份。
[[tool.importlinter.contracts]]
name = "路线中立层不依赖参考生视频子包"
type = "forbidden"
source_modules = [
    "lib.script.draft_violation",
    "lib.script.draft_quarantine",
    "lib.episode.episode_paths",
    "lib.references.reference_catalog",
]
forbidden_modules = ["lib.script.reference_video"]

[[tool.importlinter.contracts]]
name = "视频请求事实不依赖参考生视频子包"
type = "forbidden"
source_modules = ["lib.generation.video_request_facts"]
forbidden_modules = ["lib.script.reference_video"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "核心库不依赖服务端"
type = "forbidden"
source_modules = ["lib"]
forbidden_modules = ["server"]

[[tool.importlinter.contracts]]
name = "核心库不依赖 HTTP 框架"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["lib"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Agent 工具集声明不依赖宿主 SDK"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "server.agent_toolset.content_read",
    "server.agent_toolset.declaration",
    "server.agent_toolset.envelope",
    "server.agent_toolset.episode_planning",
    "server.agent_toolset.generation_batches",
    "server.agent_toolset.grid_storyboards",
    "server.agent_toolset.media_generation",
    "server.agent_toolset.orientation",
    "server.agent_toolset.project_entry",
    "server.agent_toolset.repair_channel",
    "server.agent_toolset.script_authoring",
    "server.agent_toolset.script_editing",
    "server.agent_toolset.toolset",
    "server.agent_toolset.video_review",
    "server.agent_toolset.workflow_completion",
    "server.media_tools.assets",
    "server.media_tools.context",
    "server.media_tools.grid",
    "server.media_tools.image_edits",
    "server.media_tools.narration_audio",
    "server.media_tools.storyboards",
    "server.media_tools.video_review",
    "server.media_tools.videos",
    "server.tool_runtime",
]
forbidden_modules = ["claude_agent_sdk", "mcp"]

[tool.deptry]
exclude = ["venv", "\\.venv", "\\.direnv", "\\.git", "setup\\.py", "\\.worktrees", "\\.claude/worktrees"]
known_first_party = ["lib", "server", "alembic", "scripts", "tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "aiosqlite",        # SQLAlchemy 的 sqlite+aiosqlite 异步驱动
    "asyncpg",          # SQLAlchemy 的 postgresql+asyncpg 异步驱动
    "python-multipart", # Starlette 解析 multipart/form-data 的后端
    "socksio",          # httpx 的 SOCKS 代理传输后端
    "lxml",             # BeautifulSoup 的 lxml / lxml-xml 解析器后端
    "mutmut",           # 变异测试 CLI，源码不 import 它；变异后的模块只在 mutants/ 副本里 import
    "pytest-testmon",   # pytest 插件，经 entry point 加载；按改动选测试，用法见 docs/agents/testing.md
]
DEP004 = [
    "anyio",          # 回归测试直接构造 httpx 所用的 anyio 取消域
    "pytest",
    "_pytest",        # pytest 的内部模块，根 conftest 复用其选择参数解析器
    "pytest_asyncio", # pytest 的 asyncio 插件，测试内直接用 @pytest_asyncio.fixture（本规则按模块名匹配）
    "respx",
    "blockbuster",    # 事件循环阻塞检测，tests/blocking_guard 护栏的拦截点来源
    "time_machine",   # scripts/e2e_record_backend.py 的 --perturb 前移系统时钟，核对 e2e 替身与录制日期无关
]

[tool.ruff]
line-length = 120
src = [".", "packages/arcreel-market-core/src", "packages/arcreel-catalog-core/src"]
exclude = [".worktrees", ".claude/worktrees", ".agents/skills"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "PIE", "PT", "RET", "PERF", "RUF", "SIM", "ASYNC",
    "TID251", "PLW1514", "S108", "S602", "S604", "S605", "S607",
]
ignore = ["E402", "E501", "RUF001", "RUF002", "RUF003"]
# PLW1514 只在 preview 中提供，explicit-preview-rules 保证其他规则不受 preview 影响。
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.O_NOFOLLOW".msg = "Windows 上不存在。用 getattr(os, \"<名>\", 0) 取值；不可信路径缺少 O_NOFOLLOW 时，见 docs/standards/backend.md「不可信路径缺少 `O_NOFOLLOW` 时，打开后校验文件身份」"
"os.O_DIRECTORY".msg = "Windows 上不存在。用 getattr(os, \"<名>\", 0) 取值；不可信路径缺少 O_NOFOLLOW 时，见 docs/standards/backend.md「不可信路径缺少 `O_NOFOLLOW` 时，打开后校验文件身份」"
"os.O_NONBLOCK".msg = "Windows 上不存在。用 getattr(os, \"<名>\", 0) 取值；不可信路径缺少 O_NOFOLLOW 时，见 docs/standards/backend.md「不可信路径缺少 `O_NOFOLLOW` 时，打开后校验文件身份」"
"asyncio.create_subprocess_shell".msg = "命令经 shell 解析，Windows 上行为不同且有注入风险。改用 asyncio.create_subprocess_exec 并传 list 参数"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108", "S607"]
"packages/*/tests/**" = ["S108", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.basedpyright]
include = ["lib", "server", "alembic", "tests", "scripts", "packages/arcreel-market-core/src", "packages/arcreel-market-core/tests", "packages/arcreel-catalog-core/src", "packages/arcreel-catalog-core/tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".worktrees",
    ".claude/worktrees",
    "frontend",
    "projects",
    "agent_runtime_profile",
    "vertex_keys",
    "build",
    "dist",
    "alembic/versions",
]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
pythonPlatform = "All"

typeCheckingMode = "standard"

reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportImportCycles = false
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
# reportUnreachable 在回调赋值上会误报：basedpyright 不跟踪回调里的赋值，`x: T | None = None` 配 `nonlocal` 会让外层的空值判定被当成恒真、随后的分支被判不可达。
# 这类告警改用单元素列表当信箱（`box: list[T] = []`，回调里 append，外层读 box[0]），不要删除被误判的分支，也不要加忽略注释。
reportUnreachable = "warning"
reportDeprecated = "warning"

reportGeneralTypeIssues = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportTypedDictNotRequiredAccess = "error"
reportPrivateImportUsage = "error"
reportInvalidTypeForm = "error"
reportInvalidTypeArguments = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/arcreel-market-core/tests"
extraPaths = ["packages/arcreel-market-core/tests"]
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/arcreel-catalog-core/tests"
extraPaths = ["packages/arcreel-catalog-core/tests"]

[[tool.basedpyright.executionEnvironments]]
root = "alembic"
# alembic 模板里的 `from alembic import context` 等运行期注入符号静态不可解析，此域不做闸门
reportMissingImports = "none"

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
reportArgumentType = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalCall = "none"
reportOptionalOperand = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportAttributeAccessIssue = "none"
reportPossiblyUnboundVariable = "none"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
reportMissingImports = "none"

[tool.mutmut]
# 必须显式写：不写时 mutmut 只推断出 lib/，漏掉 server/
source_paths = ["lib", "server"]
# tests/integration/lib/generation/test_task_failure_capability.py 里三个用例用 ast 扫 lib/ server/ 源码里的 capability code
# 字面量并与登记表比对；mutants/ 里的源文件同时含全部字符串 mutant 变体（XXcodeXX / CODE），扫描必报「未登记」，
# stats 阶段直接失败。凡读源码文本而非 import 模块的用例都要这样按 nodeid --deselect，不整文件 --ignore：
# 同文件其余用例是 bound_reason / collapse_cascade_reason / 级联渲染的行为测试，其中部分路径由它们独家覆盖，
# 整文件排除会让 lib/generation/task_failure.py 的真变异体记成存活。
# 只排除扫描用例同样只会多出假存活：它们独家能杀的只有 code 字面量的变体，而各 backend 用例都断言 exc.code。
pytest_add_cli_args = [
    "-p",
    "tests.mutmut_plugin",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_capability_codes_registered_no_drift",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_no_unscannable_capability_construction_sites",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_capability_construction_sites_supply_every_template_param",
]
# pytest_add_cli_args_test_selection 不设：走全量 testpaths。仅 tests/unit 快 5.5 倍，
# 但存活集合约 45% 是假存活，复核每个都要跑一次全量套件，总账反而更贵。
# timeout_multiplier / timeout_constant 保持默认（15 / 1.0），不要调小。
# 预算按关联用例的运行时长外推，调小只会让慢用例上的真存活记成超时（⏰），每个都得新进程复核。
also_copy = [
    "agent_runtime_profile",
    "alembic",
    "alembic.ini",
    "scripts",
    "skills",
    "skills-lock.json",
    "public",
    ".github",
    "frontend/src",
]
