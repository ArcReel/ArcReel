[project]
name = "arcreel"
# managed by release-please — do not bump manually
version = "0.35.0"
description = "AI video generation workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.153",
    "fastapi>=0.138.2",
    # ASGI types and MutableHeaders / FormData / UploadFile not re-exported by fastapi come directly from starlette.
    "starlette>=1.8.0",
    "google-genai>=2.21.0",
    "Pillow>=12.1.1",
    "pydantic>=2.12.5",
    # ErrorDetails / PydanticCustomError not re-exported by pydantic come directly from pydantic-core.
    "pydantic-core>=2.46.4",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pwdlib[argon2]>=0.3.0",
    "volcengine-python-sdk[ark]>=5.0.17",
    "openai>=2.30.0",
    "xai-sdk>=1.20.0",
    "pyjianyingdraft>=0.3.0",
    "instructor>=1.16.0",
    "charset-normalizer>=3.4.6",
    "docx2txt>=0.9",
    "mammoth>=1.12.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "packaging>=24.0",
    "portalocker>=2.10.1",
    "pdf-oxide>=0.3.46",
    "socksio>=1.0.0",
    "mcp>=1.29.0,<2",
    "jsonschema>=4.26.0",
    "httpx>=0.28.1",
    "grpcio>=1.83.0",
    "numpy>=2.5.2",
    "jinja2>=3.1.6",
    "arcreel-market-core",
    "arcreel-catalog-core",
    # Bundled ffmpeg, accessed through the lib/infra/ffmpeg.py locator; no system ffmpeg / ffprobe dependency.
    "imageio-ffmpeg>=0.6.0",
    # 1.x uses httpx2, bypassing respx and httpx-based custom transports; constraints: docs/agents/dependencies.md.
    "anthropic>=0.125.0,<1",
    "tos>=2.9.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "pre-commit>=4.0.0",
    "python-docx>=1.2.0",
    "basedpyright>=1.39.4",
    "import-linter>=2.13",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
    "deptry>=0.24.0",
    "pytest-testmon>=2.2.0",
    "blockbuster>=1.5.29",
    "anyio>=4.14.2",
]
# Mutation-testing tool, outside dev: install with `uv sync --group mutation` only for batch mutmut runs.
# A separate group pins its version in uv.lock for dependabot visibility; process: docs/testing/mutmut-runbook.md.
mutation = [
    "mutmut==3.7.0",
]

[tool.uv.workspace]
members = ["packages/arcreel-market-core", "packages/arcreel-catalog-core"]

[tool.uv.sources]
arcreel-market-core = { workspace = true }
arcreel-catalog-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --durations=25"
asyncio_mode = "auto"
# Hang protection, not a runtime budget: the slowest current test takes 30s; allow 4x headroom. If an individual test
# needs more, relax it with `@pytest.mark.timeout(N)` rather than raising the global value.
timeout = 120
# signal works for async and sync tests; timeouts are ordinary failures (session continues, teardown
# runs normally, attribution remains possible). thread hard-kills with os._exit, equivalent to worker crashes under xdist.
timeout_method = "signal"
# Keep parallelism out of addopts; enable it explicitly only in CI (-n 4 --dist loadfile). Small selections are slower in parallel:
# each worker reimports server.app, whose fixed cost consumes all benefit; local debugging mostly uses small selections.
markers = [
    "unit: Fast, isolated tests; may read committed repository files; writes stay in tmp_path, without real databases, subprocesses, networks, or external services",
    "integration: Real collaboration across modules; do not mock the tested module's public entry points (that would test the mock itself)",
    "e2e: End-to-end tests requiring real external resources (remote APIs, model calls, heavy ffmpeg, etc.); skipped by default in CI",
    "sqlite_only: SQLite-specific tests (requiring SQLite-specific fixtures/behavior); skipped by the PostgreSQL CI job",
    "uses_db: Tests accessing real databases (repositories/DAOs/ORM/migrations); PostgreSQL jobs select them with `-m uses_db`. Automatically injected by conftest based on fixture use",
    "local_port: Tests binding 127.0.0.1 ports; conftest skips these with a reason where local port binding is forbidden (e.g. Agent sandboxes)",
]

[tool.coverage.run]
source = ["lib", "server", "arcreel_market_core", "arcreel_catalog_core"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    'if __name__ == "__main__":',
    "if __name__ == '__main__':",
]

[tool.importlinter]
# Include server in analysis to expose cross-package edges for the core-library/server boundary; include arcreel_market_core
# to expose its edges to lib / server for the subpackage/main-repository boundary. External packages count only as leaves,
# allowing the core-library/HTTP-framework rule to name fastapi / starlette.
root_packages = ["lib", "server", "arcreel_market_core", "arcreel_catalog_core"]
include_external_packages = true

# lib.config < lib.backends.*_backends < lib.custom_provider < lib.market: config is the configuration-parsing base; backends
# assembles provider implementations above it; custom_provider assembles custom providers above backends; market (client-side
# source registration, entry services, installation records) assembles entries into custom endpoints at the top. All four layers sit above arcreel_market_core,
# the bottommost subpackage; see its no-main-repository dependency rule below. The four backend packages are sibling layers (`:` separated); references to
# sibling contracts (e.g. image channels using video_backends.base IMAGE_MIME_TYPES) do not violate direction. Shared runtime support lives in
# lib.backends.backend_runtime, outside all layers.
# ignore_imports records existing violations; each exemption cuts the **terminal edge of the violating chain**, not its first hop, so
# later reverse dependencies in intermediate modules (project_manager / usage_repo etc.) remain blocked by the contract.
# Before adding an entry, confirm the edge cannot be eliminated locally; remove each line as its violation is eliminated.
[[tool.importlinter.contracts]]
name = "lib.config / lib.backends.*_backends / lib.custom_provider / lib.market layering contract"
type = "layers"
layers = [
    "market",
    "custom_provider",
    "backends.image_backends : backends.video_backends : backends.audio_backends : backends.text_backends",
    "config",
]
containers = ["lib"]
ignore_imports = [
    # lib.config.resolver directly references the custom-provider assembly layer above it (lazy function-body imports still count in static analysis).
    "lib.config.resolver -> lib.custom_provider",
    "lib.config.resolver -> lib.custom_provider.capabilities",
    "lib.config.resolver -> lib.custom_provider.default_models",
    "lib.config.resolver -> lib.custom_provider.endpoint_resolution",
    "lib.config.resolver -> lib.custom_provider.model_facts",
    # lib.config.resolver directly references the backend layer above it.
    "lib.config.resolver -> lib.backends.text_backends.base",
    # Intermediate modules make the backend layer reachable from below config.
    "lib.backends.backend_assembly.specs -> lib.backends.audio_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.image_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.video_backends.registry",
    "lib.backends.backend_assembly.specs -> lib.backends.text_backends.registry",
    # Declarative built-in endpoint assembly seam (ADR 0039): spec rows with registry_backend="declarative" read
    # capabilities and construct backends from shipped definitions, so the spec table reaches both backend and custom_provider layers.
    "lib.backends.backend_assembly.specs -> lib.custom_provider.builtin_definitions",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.declarative_backend",
    "lib.backends.backend_assembly.specs -> lib.custom_provider.endpoints",
    # Capability overrides combining user-added models under built-in providers with channel facts share the custom-provider merge point (docs/adr/0104).
    "lib.backends.backend_assembly.specs -> lib.custom_provider.capabilities",
    "lib.project.project_manager -> lib.backends.text_backends.base",
    "lib.backends.text_generator -> lib.backends.text_backends.base",
    "lib.backends.text_generator -> lib.backends.text_backends.factory",
    # Intermediate modules reference custom_provider in reverse (provider_id resolution and custom-provider accounting).
    "lib.backends.backend_assembly.assembler -> lib.custom_provider",
    "lib.backends.backend_assembly.assembler -> lib.custom_provider.loader",
    "lib.billing.multipliers -> lib.custom_provider",
    "lib.billing.multipliers -> lib.custom_provider.discovery_formats",
    "lib.db.repositories.usage_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider",
    "lib.db.repositories.custom_provider_repo -> lib.custom_provider.endpoints",
    "lib.db.models.custom_provider -> lib.custom_provider",
]

# ComfyUI endpoint definitions bypass the declarative runtime (docs/adr/0081): the two kinds have different structures, sharing only diagnostic
# carriers, diagnostic translation, and kind constants. If comfyui reaches the declarative template engine, value paths, or its validator,
# it imports the JSON in/out + submit/poll assumptions into node graphs, making save-time and fill-time judgments diverge. Reverse dependencies are forbidden too:
# endpoint_definition.validator owns the dispatch table; its import of comfyui.validator is the only allowed direction.
# The comfyui side has two parts: definition contracts/save-time decisions in arcreel_market_core.comfyui, and client/execution/two call channels
# in lib.custom_provider.comfyui. Check indirect dependencies too: their channel runtime support
# (lib.backends.backend_runtime) and video contracts (arcreel_market_core.video_backend_contract) must not reach the declarative runtime.
[[tool.importlinter.contracts]]
name = "ComfyUI endpoint implementations do not depend on the declarative runtime"
type = "forbidden"
source_modules = ["lib.custom_provider.comfyui", "arcreel_market_core.comfyui"]
forbidden_modules = [
    "lib.custom_provider.declarative_backend",
    "arcreel_market_core.endpoint_definition.validator",
    "arcreel_market_core.endpoint_definition.template_engine",
    "arcreel_market_core.endpoint_definition.response_extractor",
    "arcreel_market_core.endpoint_definition.jsonpath_subset",
]

# arcreel_market_core is bottommost: market-source tools and endpoint-definition validators are installed separately by market-source CI and the official service,
# which cannot install the rest of the ArcReel application. When the subpackage needs application capabilities (translation catalogs, shared HTTP clients), callers
# inject them as parameters. The main repository depends on the subpackage; the reverse direction is always forbidden.
[[tool.importlinter.contracts]]
name = "arcreel_market_core does not depend on the main repository"
type = "forbidden"
source_modules = ["arcreel_market_core"]
forbidden_modules = ["lib", "server"]

# arcreel_catalog_core is also bottommost: catalog-data formats and validators are installed separately by catalog-data repository CI;
# it depends only on the standard library. The main repository depends on the subpackage; the reverse direction is always forbidden.
[[tool.importlinter.contracts]]
name = "arcreel_catalog_core does not depend on the main repository"
type = "forbidden"
source_modules = ["arcreel_catalog_core"]
forbidden_modules = ["lib", "server", "arcreel_market_core"]

# Route-neutral layers must not depend on one specific route subpackage. Violation-entry types (draft_violation), draft envelopes
# (draft_quarantine), formal script_plan paths/write-deny lists (episode_paths), and registered-reference-name
# constructors (reference_catalog) treat drama / narration / reference_video equally. Any
# import lib.script.reference_video ties mechanisms shared by all three routes to just one.
# lib.script.script_review is excluded: it separately depends on lib.script.reference_video.duration_migration (reference-to-video
# duration adoption); including it would require a masking baseline, making the contract declare something currently untrue.
# lib.script.script_references is likewise excluded: it intentionally depends on lib.script.reference_video.text_parser; one category of reference-name
# payload locations uses body @[名称] markers, and only this parser recognizes them.
[[tool.importlinter.contracts]]
name = "Route-neutral layer does not depend on the reference-video subpackage"
type = "forbidden"
source_modules = [
    "lib.script.draft_violation",
    "lib.script.draft_quarantine",
    "lib.episode.episode_paths",
    "lib.references.reference_catalog",
]
forbidden_modules = ["lib.script.reference_video"]

# Video request facts are the shared evaluation entry point for both video routes (docs/adr/0086); they must not directly import the reference-to-video subpackage.
# This contract checks direct dependencies only, not the indirect project-loading chain through lib.config.resolver → lib.project.project_manager.
[[tool.importlinter.contracts]]
name = "Video-request facts do not depend on the reference-video subpackage"
type = "forbidden"
source_modules = ["lib.generation.video_request_facts"]
forbidden_modules = ["lib.script.reference_video"]
allow_indirect_imports = true

# Core-library/server boundary (website/docs/dev/architecture.md, core-library/server boundary): the core library owns domain logic and
# infrastructure; the server owns delivery and use-case orchestration shared by multiple entry points. Dependencies run only from server to core library. When core needs server
# capabilities (e.g. generation Worker task/resume executors), inject them at application assembly (server/app.py).
[[tool.importlinter.contracts]]
name = "Core library does not depend on the server"
type = "forbidden"
source_modules = ["lib"]
forbidden_modules = ["server"]

# The core library knows nothing about HTTP: request-language resolution, dependency injection, and other framework glue belong to the server (server.i18n etc.).
# Check only imports written by the core library itself; the preceding contract already blocks indirect framework access through server.
[[tool.importlinter.contracts]]
name = "Core library does not depend on HTTP frameworks"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["lib"]
forbidden_modules = ["fastapi", "starlette"]

# Agent tool declarations, envelopes, and handlers are host-independent (docs/adr/0087); host SDKs appear only in embedded and remote adapters.
# Check only imports written by these modules themselves.
[[tool.importlinter.contracts]]
name = "Agent toolset declarations do not depend on the host SDK"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "server.agent_toolset.content_read",
    "server.agent_toolset.declaration",
    "server.agent_toolset.envelope",
    "server.agent_toolset.episode_planning",
    "server.agent_toolset.generation_batches",
    "server.agent_toolset.grid_storyboards",
    "server.agent_toolset.media_generation",
    "server.agent_toolset.orientation",
    "server.agent_toolset.project_entry",
    "server.agent_toolset.repair_channel",
    "server.agent_toolset.script_authoring",
    "server.agent_toolset.script_editing",
    "server.agent_toolset.toolset",
    "server.agent_toolset.video_review",
    "server.agent_toolset.workflow_completion",
    "server.media_tools.assets",
    "server.media_tools.context",
    "server.media_tools.grid",
    "server.media_tools.image_edits",
    "server.media_tools.narration_audio",
    "server.media_tools.storyboards",
    "server.media_tools.video_review",
    "server.media_tools.videos",
    "server.tool_runtime",
]
forbidden_modules = ["claude_agent_sdk", "mcp"]

[tool.deptry]
# Match basedpyright include: core library, server, migration infrastructure, scripts, and tests.
# exclude takes deptry defaults minus tests (test imports also undergo dependency hygiene checks), plus worktree directories.
exclude = ["venv", "\\.venv", "\\.direnv", "\\.git", "setup\\.py", "\\.worktrees", "\\.claude/worktrees"]
known_first_party = ["lib", "server", "alembic", "scripts", "tests"]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but not imported): all are plugins loaded at runtime through entry points / backend registration;
# no import appears in source.
DEP002 = [
    "aiosqlite",        # SQLAlchemy sqlite+aiosqlite async driver
    "asyncpg",          # SQLAlchemy postgresql+asyncpg async driver
    "python-multipart", # Starlette multipart/form-data parsing backend
    "socksio",          # httpx SOCKS proxy transport backend
    "lxml",             # BeautifulSoup lxml / lxml-xml parser backend
    "mutmut",           # Mutation-test CLI, not imported by source; mutated modules import it only in mutants/ copies
    "pytest-testmon",   # Entry-point-loaded pytest plugin; selects tests by changes; usage: docs/agents/testing.md
]
# DEP004 (importing dev dependencies): tests/ and scripts/ are scanned; deptry cannot distinguish dev from production files
# by directory, so explicitly list their legitimate testing-framework imports. Other dev dependencies remain protected.
DEP004 = [
    "anyio",          # Regression tests directly construct the anyio cancellation scopes used by httpx
    "pytest",         # Test framework
    "_pytest",        # pytest internals; root conftest reuses its selection-argument parser
    "pytest_asyncio", # pytest asyncio plugin; tests directly use @pytest_asyncio.fixture (this rule matches module names)
    "respx",          # httpx test double
    "blockbuster",    # Event-loop blocking detection; source of tests/blocking_guard interception points
]

[tool.ruff]
line-length = 120
# Subpackages use src layouts: include them in src so isort recognizes arcreel_market_core and arcreel_catalog_core as first-party.
src = [".", "packages/arcreel-market-core/src", "packages/arcreel-catalog-core/src"]
# .agents/skills contains external skills installed according to skills-lock.json, updated from upstream and exempt from repository rules.
exclude = [".worktrees", ".claude/worktrees", ".agents/skills"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "PIE", "PT", "RET", "PERF", "RUF", "SIM", "ASYNC",
    "TID251", "PLW1514", "S108", "S602", "S604", "S605", "S607",
]
# RUF001-003 treat full-width punctuation in Chinese comments/copy as confusable Unicode, producing only noise for Chinese text.
ignore = ["E402", "E501", "RUF001", "RUF002", "RUF003"]
# PLW1514 is preview-only; explicit-preview-rules keeps other rules unaffected by preview.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.O_NOFOLLOW".msg = "Unavailable on Windows. Read values with getattr(os, \"<名>\", 0); for untrusted paths without O_NOFOLLOW, see docs/standards/backend.md, \"Without `O_NOFOLLOW`, verify file identity after opening untrusted paths\"."
"os.O_DIRECTORY".msg = "Unavailable on Windows. Read values with getattr(os, \"<名>\", 0); for untrusted paths without O_NOFOLLOW, see docs/standards/backend.md, \"Without `O_NOFOLLOW`, verify file identity after opening untrusted paths\"."
"os.O_NONBLOCK".msg = "Unavailable on Windows. Read values with getattr(os, \"<名>\", 0); for untrusted paths without O_NOFOLLOW, see docs/standards/backend.md, \"Without `O_NOFOLLOW`, verify file identity after opening untrusted paths\"."
"asyncio.create_subprocess_shell".msg = "Commands are parsed by the shell, behave differently on Windows, and carry injection risks. Use asyncio.create_subprocess_exec with list arguments instead."

[tool.ruff.lint.per-file-ignores]
# /tmp in tests is a fake path string; test git calls intentionally depend on PATH.
"tests/**" = ["S108", "S607"]
# Apply the same rules to subpackage tests as main-repository tests/.
"packages/*/tests/**" = ["S108", "S607"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI conventionally calls dependencies in parameter defaults, making B008 a false positive; registration avoids per-site noqa.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.basedpyright]
include = ["lib", "server", "alembic", "tests", "scripts", "packages/arcreel-market-core/src", "packages/arcreel-market-core/tests", "packages/arcreel-catalog-core/src", "packages/arcreel-catalog-core/tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".worktrees",
    ".claude/worktrees",
    "frontend",
    "projects",
    "agent_runtime_profile",
    "vertex_keys",
    "build",
    "dist",
    "alembic/versions",
]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
pythonPlatform = "All"

typeCheckingMode = "standard"

reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportImportCycles = false
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
# reportUnreachable produces false positives for callback assignments: basedpyright does not track them; `x: T | None = None` plus `nonlocal` makes the outer null check appear always true and the next branch unreachable.
# Use a single-element list as a mailbox instead (`box: list[T] = []`, append in the callback, read box[0] outside); do not delete the falsely flagged branch or add ignore comments.
reportUnreachable = "warning"
reportDeprecated = "warning"

reportGeneralTypeIssues = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportTypedDictNotRequiredAccess = "error"
reportPrivateImportUsage = "error"
reportInvalidTypeForm = "error"
reportInvalidTypeArguments = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
# These rules do not gate tests: repo/manager calls typically use assertion-based access, producing noisy narrowing warnings;
# mock returns are often subscripted too. The gate runs `basedpyright --warnings`, so warnings block;
# setting these downgrades to none honestly expresses the existing decision not to gate the test domain.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"

# Apply main-repository tests/ rules to subpackage tests; helper modules import through pytest pythonpath, so include them in extraPaths here too.
[[tool.basedpyright.executionEnvironments]]
root = "packages/arcreel-market-core/tests"
extraPaths = ["packages/arcreel-market-core/tests"]
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/arcreel-catalog-core/tests"
extraPaths = ["packages/arcreel-catalog-core/tests"]

[[tool.basedpyright.executionEnvironments]]
root = "alembic"
# Runtime-injected symbols such as `from alembic import context` in alembic templates cannot be resolved statically; this domain does not gate.
reportMissingImports = "none"

# scripts/ contains one-off helpers (migrations, fixture generation, smoke tests),
# not worth extensive typing effort, but tests/scripts/ imports them, so they must resolve.
[[tool.basedpyright.executionEnvironments]]
root = "scripts"
reportArgumentType = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalCall = "none"
reportOptionalOperand = "none"
reportOptionalIterable = "none"
reportOperatorIssue = "none"
reportAttributeAccessIssue = "none"
reportPossiblyUnboundVariable = "none"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
# Scripts import after injecting sys.path, which cannot be resolved statically; this domain does not gate.
reportMissingImports = "none"

# Mutation testing (mutmut 3.7.0), outside dev dependencies; run on demand with `uv run --with mutmut==3.7.0 mutmut run`.
# Mutation score is a signal, not a gate: do not add tests merely to kill mutants; use survivors only to select tests for review.
[tool.mutmut]
# Operations (batch runs, timeout rechecks, three-layer acceptance, known traps): docs/testing/mutmut-runbook.md. Only configuration tradeoffs belong here.
# Must be explicit: otherwise mutmut infers only lib/, omitting server/.
source_paths = ["lib", "server"]
# Fill in modules to mutate per batch; empty means the entire source_paths scope (hours per round, impractical).
# only_mutate = ["lib/speech/speech_rate.py"]
# tests.mutmut_plugin gives each mutmut session a private basetemp so parallel subprocess teardown no longer races over symlinks under a shared root;
# load it only here, never in local or CI pytest.
# Three tests in tests/integration/lib/generation/test_task_failure_capability.py scan lib/ server/ source with ast for capability-code
# literals and compare them against the registry. Source in mutants/ contains every string-mutant variant (XXcodeXX / CODE), inevitably reporting unregistered codes
# and failing during stats. Deselect such source-text-reading tests by nodeid --deselect, not whole-file --ignore:
# other tests in that file check bound_reason / collapse_cascade_reason / cascade-rendering behavior, some exclusively covering their paths;
# excluding the whole file would falsely mark real lib/generation/task_failure.py mutants as survivors.
# Excluding only the scanning tests also adds only false survivors: their exclusive kills are code-literal variants, while backend tests all assert exc.code.
pytest_add_cli_args = [
    "-p",
    "tests.mutmut_plugin",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_capability_codes_registered_no_drift",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_no_unscannable_capability_construction_sites",
    "--deselect=tests/integration/lib/generation/test_task_failure_capability.py::test_capability_construction_sites_supply_every_template_param",
]
# Leave pytest_add_cli_args_test_selection unset: use full testpaths. tests/unit alone is 5.5x faster,
# but about 45% of survivors are false; each needs a full-suite recheck, increasing total cost.
# Keep timeout_multiplier / timeout_constant defaults (15 / 1.0); do not reduce them.
# Budgets extrapolate from related-test runtimes; reducing them classifies real survivors in slow tests as timeouts (⏰), each requiring a new-process recheck.
also_copy = [
    "agent_runtime_profile",
    "alembic",
    "alembic.ini",
    "scripts",
    "skills",
    "skills-lock.json",
    "public",
    ".github",
    "frontend/src",
]
