repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (python staged)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format (python staged)
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: basedpyright
        name: basedpyright (full project type check)
        entry: uv run basedpyright --warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: frontend-eslint
        name: eslint (frontend staged)
        entry: bash -c 'files=(); for f in "$@"; do files+=("${f#frontend/}"); done; cd frontend && ./node_modules/.bin/eslint --fix "${files[@]}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: true

  # Local workflow gates; upgrade both revs together with .github/workflows/test.yml
  # workflow-static job (checked by scripts/audit_conventions.py).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --min-severity, medium]
        exclude: ^\.agents/  # Vendored skills’ upstream CI does not run in this repository
  - repo: local
    hooks:
      - id: react-doctor
        name: react-doctor
        # Run inside frontend/: root execution misses React and disables library-specific rules.
        # --staged reports preexisting whole-file issues; block errors only until old warnings are resolved.
        entry: sh -c 'cd frontend && node_modules/.bin/react-doctor --staged --blocking error'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.[jt]sx?$
