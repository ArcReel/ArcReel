[project]
name = "arcreel-catalog-core"
version = "0.1.0"
description = "ArcReel model catalog data format and validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcreel_catalog_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test directory is not a package: helpers import through pythonpath, tests by file path, avoiding name collisions.
pythonpath = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
