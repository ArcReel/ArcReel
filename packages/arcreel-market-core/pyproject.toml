[project]
name = "arcreel-market-core"
version = "0.1.0"
description = "ArcReel market source tools and endpoint definition validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonpath-rfc9535>=1.0.0",
    "jsonschema>=4.26.0",
    "packaging>=24.0",
    "Pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcreel_market_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test directory is not a package: helpers import through pythonpath, tests by file path, avoiding name collisions.
pythonpath = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
